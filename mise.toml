# Narzędzia i zadania DOCFIND.
#
# Wejściem jest ./bin/mise — skrypt z `mise generate install-script`, który
# pobiera mise w przypiętej wersji, sprawdza sumę z pliku podpisanego przez
# autorów i trzyma wszystko w .mise/ w repozytorium. Nie trzeba instalować mise
# globalnie ani aktywować go w powłoce; lokalnie i w CI to te same polecenia:
#
#   ./bin/mise install         narzędzia z mise.lock, z weryfikacją sum
#   ./bin/mise run test        to samo, co zadanie test w CI
#   ./bin/mise run ci          cały pipeline po kolei, jak w CI
#   ./bin/mise tasks           lista zadań
#   ./bin/mise exec -- kubectl get pods    narzędzie z przypiętej wersji
#
# Logika narzędzi i bramek jest w Go (tools/, program dft — decyzja 23).
# Zadania wołają ci/dft, który buduje program z bieżącego drzewa i go
# uruchamia; skrypty ci/*.sh, które jeszcze zostały, przechodzą do Go
# w kolejnych zmianach. Zadania TOML biegną w `sh -o errexit -c` (dash, bez
# pipefail), więc nie ma w nich nic poza wywołaniem programu.
#
# Czego mise tu nie zarządza:
# - uv — jedynym źródłem wersji jest Dockerfile, gdzie przypięcie digestem
#   aktualizuje Dependabot. Dependabot nie obsługuje mise, więc druga kopia
#   wersji tutaj rozjeżdżałaby się z Dockerfile przy każdej jego aktualizacji.
#   CI instaluje wersję z Dockerfile, run-tests.sh ostrzega o innej lokalnie.
# - Python — wersję do testów wybiera uv z services/api/.python-version,
#   w produkcji decyduje obraz bazowy. Trzeci menedżer interpretera byłby
#   trzecim miejscem, w którym wersja może się rozjechać.
# - obrazy (k3s, BuildKit, curl), charty i commit schematów — przypięte
#   w ci/pins.env, pliku danych czytanym przez dft i workflowy.
#
# Aktualizacja narzędzia: zmień wersję poniżej, potem `./bin/mise lock`
# i `./bin/mise install`. mise sam odrzuca wydania młodsze niż 24 h
# (minimum_release_age), ale cooldown projektu to 7 dni — wybieraj wersję
# co najmniej tydzień po wydaniu. Aktualizacja samego mise:
#   mise generate install-script -V <wersja> -l -w bin/mise
# z mise w nowej wersji, zweryfikowanego jak przy pierwszym przypięciu
# (docs/DECYZJE.md, decyzja 23).

min_version = "2026.9.10"

[settings]
# mise.lock trzyma dla każdej platformy URL i sumę artefaktu. locked = true
# odmawia instalacji czegokolwiek, czego nie ma w lockfile — narzędzie nie
# trafi do PATH bez sumy zapisanej w repozytorium (decyzja 20).
lockfile = true
locked = true

[tools]
# W tej samej wersji co klaster (DF_KUBERNETES_VERSION w ci/pins.env) —
# pilnuje tego `dft check versions`.
kubectl = "1.36.4"
k3d = "5.9.0"
helm = "4.3.0"
kubeconform = "0.8.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
# Audyt bezpieczeństwa workflowów: wstrzyknięcia w wyrażeniach, nadmiarowe
# uprawnienia, zatruwanie cache, zbyt krótki cooldown Dependabota.
zizmor = "1.30.1"
# Do ci/apply-repo-settings.sh; gh z apt w Ubuntu 24.04 jest sprzed
# `gh attestation verify`.
gh = "2.101.0"
# Do ci/check-tls.sh — `cmctl renew` wymusza odnowienie certyfikatu tak samo,
# jak zrobiłby to cert-manager przed jego wygaśnięciem.
cmctl = "2.6.1"
# Toolchain narzędzi i bramek z tools/ (decyzja 23). Ta sama wersja stoi
# w dyrektywie `go` w tools/go.mod — pilnuje tego `dft check versions`.
# Aktualizacja: wersja tutaj, `./bin/mise lock`, w tools/
# `go mod edit -go=<wersja>`, potem `./bin/mise run test`.
go = "1.27.1"

[env]
# Kubeconfig projektu zamiast globalnego ~/.kube/config. Lokalny klaster nie
# dopisuje się do cudzych kontekstów i nie przełącza bieżącego, a kubectl
# uruchomiony przez mise widzi tylko ten klaster. Tę samą ścieżkę ustawia
# ci/lib.sh dla skryptów uruchamianych bez mise.
KUBECONFIG = "{{config_root}}/.cache/kubeconfig"
# Polecenie `go` nie pobiera innego toolchainu, gdy go.mod zażąda nowszego —
# kończy się błędem. Przy domyślnym GOTOOLCHAIN=auto pobrałoby w trakcie biegu
# toolchain, którego nie ma w mise.lock (decyzja 20: „co jeszcze to pobiera,
# kiedy biegnie").
GOTOOLCHAIN = "local"
# Moduły tylko z proxy.golang.org. Przy domyślnym „…,direct" moduł, którego
# proxy nie zwróci, jest pobierany przez git prosto z repozytorium kodu —
# kolejne narzędzie i kolejne źródło w trakcie builda. Integralność sprawdza
# go.sum i baza sum (GOSUMDB, domyślnie włączona).
GOPROXY = "https://proxy.golang.org"
# Statyczne binarki bez cgo — build nie zależy od kompilatora C hosta.
# `-race` wymaga cgo, więc `dft check go` włącza je tylko na czas testów.
CGO_ENABLED = "0"

[tasks.test]
description = "Spójność wersji, lint, typy, testy, polityki, schemat, kod Go — to samo co zadanie test w CI"
run = [
    "ci/dft check versions",
    "ci/run-tests.sh",
    "ci/dft check go",
]

[tasks."check:tools"]
description = "Narzędzia z tools/ zbudowane z pamięcią podręczną i od zera dają te same bajty"
run = "ci/dft check reproducible-tools"

[tasks.pins]
description = "Przypięte wersje dla workflowów — uv i BuildKit — do GITHUB_OUTPUT albo na ekran"
run = "ci/dft pins github-output"

[tasks.schema]
description = "Regeneracja deploy/config/app.schema.json z modelu Pydantic"
run = "ci/gen-schema.sh"

[tasks.build]
description = "Build obrazu z wersją z gita; RELEASE=1 tylko czyste drzewo na tagu vX.Y.Z"
usage = 'arg "[service]" default="api" help="Usługa z services/"'
run = 'ci/dft build "${usage_service}"'

[tasks."check:base"]
description = "Baza obrazu zgodna z zapisaną: Alpine z ci/pins.env, Python z .python-version"
usage = 'arg "[service]" default="api" help="Usługa z services/"'
run = 'ci/dft check base "${usage_service}"'

[tasks."test:image"]
description = "Testy jednostkowe w obrazie na musl — ta sama baza co produkcja"
usage = 'arg "[service]" default="api" help="Usługa z services/"'
run = 'ci/dft test-image "${usage_service}"'

[tasks."check:runtime"]
description = "Warunki zakończenia Etapu 1 na zbudowanym obrazie (raport JSON w .cache/reports)"
usage = 'arg "[service]" default="api" help="Usługa z services/"'
run = 'ci/dft check runtime "${usage_service}"'

[tasks."test:negatives"]
description = "Warianty negatywne bramek artefaktu na prawdziwym obrazie — każdy ma zostać odrzucony"
usage = 'arg "[service]" default="api" help="Usługa z services/"'
run = 'ci/dft check negatives "${usage_service}"'

[tasks."check:reproducible"]
description = "Build z pamięcią podręczną i od zera muszą dać identyczny obraz"
usage = 'arg "[service]" default="api" help="Usługa z services/"'
run = 'ci/dft check reproducible "${usage_service}"'

[tasks.ci]
description = "Cały pipeline po kolei, jak w CI (bez publikacji)"
# Tablica biegnie sekwencyjnie i zatrzymuje się na pierwszym błędzie. Nie
# `depends`: zależności mise uruchamia równolegle (jobs = 8), a te kroki
# dzielą obraz o tym samym tagu i pamięć podręczną BuildKitu.
run = [
    { task = "test" },
    { task = "check:tools" },
    { task = "build" },
    { task = "check:base" },
    { task = "test:image" },
    { task = "check:runtime" },
    { task = "test:negatives" },
    { task = "check:reproducible" },
]

[tasks."cluster:up"]
description = "Klaster k3d (jeśli go nie ma) + build + helm upgrade --install"
run = "ci/deploy-local.sh"

[tasks."cluster:down"]
description = "Usunięcie lokalnego klastra"
run = "ci/deploy-local.sh --down"

[tasks."cluster:tls"]
description = "Warunek Etapu 3: odnowienie certyfikatu pod ruchem, bez ingerencji"
run = "ci/check-tls.sh"

[tasks."cluster:drain"]
description = "Warunek zakończenia Etapu 2: drain węzła bez utraty żądania"
run = "ci/check-drain.sh"

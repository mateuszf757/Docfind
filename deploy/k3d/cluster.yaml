# Lokalny klaster DOCFIND: 1 węzeł serwerowy i 2 robocze, każdy w osobnym
# kontenerze Dockera. Scheduler widzi trzy osobne węzły, więc kubectl drain,
# rozkład podów między węzłami i PodDisruptionBudget działają naprawdę.
#
# Obraz k3s nie jest tu wpisany — podaje go ci/deploy-local.sh z ci/lib.sh,
# żeby wersja Kubernetesa była zapisana w jednym miejscu razem z kubectl
# i schematem, względem którego kubeconform sprawdza manifesty.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: docfind
servers: 1
agents: 2

# Wszystko, co klaster wystawia na hosta, słucha wyłącznie na loopbacku.
# Domyślnie k3d wiąże porty z 0.0.0.0, czyli z każdym interfejsem — w sieci
# biurowej albo przy WSL w trybie mirrored API klastra z uprawnieniami admina
# byłoby osiągalne z zewnątrz. Decyzja 17.
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "6550"

# Porty nieuprzywilejowane zamiast 80 i 443. Docker działa tu bez roota,
# a otwarcie mu 80/443 wymagałoby obniżenia net.ipv4.ip_unprivileged_port_start,
# co odblokowuje cały zakres 80–1023 dla każdego procesu w systemie. Środowisko
# deweloperskie nie jest powodem do rozluźniania zabezpieczeń hosta. Mapowane
# od razu, choć ingress wchodzi na Etapie 3 — mapowań portów nie da się
# bezboleśnie dołożyć do istniejącego klastra.
ports:
  - port: 127.0.0.1:8080:80
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:8443:443
    nodeFilters: [loadbalancer]

options:
  k3s:
    extraArgs:
      # Traefik jest domyślnym ingressem k3s. Wyłączony, bo wejściem będzie
      # ingress-nginx (docs/DECYZJE.md, decyzja 11) — dwa kontrolery ingressu
      # walczyłyby o te same porty.
      - arg: --disable=traefik
        nodeFilters: [server:*]
      # Wbudowany CoreDNS k3s ma jedną replikę i nie ma PodDisruptionBudget —
      # drain jego węzła odcina DNS całemu klastrowi na kilka sekund, co
      # check-drain.sh złapał jako nieudane żądania (exit=28, dns=0). Skalowanie
      # go ręcznie nie przetrwa restartu serwera, bo k3s ponownie aplikuje
      # własne manifesty. CoreDNS instaluje więc deploy-local.sh z charta
      # i wartości w deploy/platform/coredns.
      - arg: --disable=coredns
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true

# cert-manager — wystawianie i odnawianie certyfikatów (decyzja 4).
# Wersja charta i suma: ci/pins.env (DF_CERT_MANAGER_CHART_*).
#
# Ten sam wzór co przy CoreDNS: domyślny chart ma jedną replikę i wyłączone
# PodDisruptionBudget. Dla cert-managera ważniejszy od kontrolera jest webhook —
# API server woła go przy każdym zapisie Certificate czy Issuer, więc jego
# niedostępność blokuje zmiany wszystkich zasobów cert-managera w klastrze.

# CRD instalowane z charta, w tej samej wersji co kontroler. keep: true —
# odinstalowanie charta nie usuwa CRD, a razem z nimi wszystkich Certificate
# i sekretów, które z nich powstały.
crds:
  enabled: true
  keep: true

replicaCount: 2

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

# Obrazy przypięte digestem (decyzja 20). Chart renderuje "obraz:tag@digest",
# a pobierany jest digest. Tag zostaje z appVersion charta dla czytelności.
image:
  digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8

# Bez limitu CPU (decyzja 16). Odnawianie certyfikatów to krótkie skoki
# obciążenia, a dławienie CFS opóźniałoby je bez powodu.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: cert-manager
        app.kubernetes.io/component: controller
    matchLabelKeys:
      - pod-template-hash

# Obsługa Gateway API: adnotacja cert-manager.io/cluster-issuer na Gateway
# tworzy Certificate dla każdego listenera HTTPS z nazwą hosta.
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true

# Sprawdzanie propagacji rekordu TXT przy DNS-01 przez publiczne resolwery,
# z pominięciem resolwera klastra. CoreDNS w klastrze przekazuje zapytania do
# resolwera WSL, a ten do sieci domowej — każde ogniwo z własnym cache,
# w którym świeżo dodany rekord TXT potrafi nie istnieć jeszcze przez minuty.
dns01RecursiveNameservers: "1.1.1.1:53,9.9.9.9:53"
dns01RecursiveNameserversOnly: true

webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  image:
    digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: cert-manager
          app.kubernetes.io/component: webhook
      matchLabelKeys:
        - pod-template-hash

# cainjector wstrzykuje CA do konfiguracji webhooków. Działa z wyborem lidera,
# więc druga replika to tylko szybsze przejęcie po awarii węzła.
cainjector:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  image:
    digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: cert-manager
          app.kubernetes.io/component: cainjector
      matchLabelKeys:
        - pod-template-hash

# Obraz solvera HTTP-01. Nie używamy HTTP-01 (decyzja 4: klaster lokalny nie ma
# wejścia z internetu), ale kontroler dostaje ten obraz jako argument i użyłby
# go przy pierwszym takim wyzwaniu — więc też jest przypięty. Polityka w
# `dft test` go nie widzi, bo w renderze to argument, nie kontener.
acmesolver:
  image:
    digest: sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503

# Job po instalacji, który czeka, aż webhook zacznie przyjmować zapisy —
# `helm upgrade --wait` kończy się wtedy dopiero, gdy cert-manager naprawdę działa.
startupapicheck:
  image:
    digest: sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

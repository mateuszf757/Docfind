# Envoy Gateway — kontroler Gateway API (decyzja 11).
# Wersja charta i suma: ci/lib.sh (DF_ENVOY_GATEWAY_CHART_*).
#
# Chart instaluje kontroler. Pody proxy Envoy, przez które płynie ruch, tworzy
# kontroler w trakcie działania, z zasobu EnvoyProxy w charcie
# deploy/charts/platform — tam są ich repliki, zasoby i PDB. W `helm template`
# tych podów nie widać, więc polityki z run-tests.sh sprawdzają je na klastrze
# (ci/check-tls.sh).

global:
  images:
    # Obraz kontrolera, przypięty digestem (decyzja 20). Ten sam obraz chart
    # ustawia shutdown-managerowi — sidecarowi w podach proxy, który wygasza
    # połączenia przy ich wymianie — więc jedno przypięcie obejmuje oba.
    # W kodzie źródłowym domyślny obraz shutdown-managera to gateway-dev:latest;
    # chart go nadpisuje, ale tylko dlatego, że ta wartość jest ustawiona.
    envoyGateway:
      image: docker.io/envoyproxy/gateway:v1.9.2@sha256:9d67017c442a70e6ae9f1a358e6c80eb653c67c2e40823d9a991e0daf37ba926
    # Obraz proxy Envoy. Ten sam, który kontroler v1.9.2 ma wbudowany jako
    # domyślny — wpisany tu jawnie, żeby aktualizacja kontrolera nie zmieniała
    # po cichu wersji proxy, przez które płynie cały ruch.
    envoyProxy:
      image: docker.io/envoyproxy/envoy:distroless-v1.39.1@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4
    # Limitowanie żądań nie jest używane, ale kontroler ma ten obraz
    # w konfiguracji i uruchomiłby go przy pierwszej takiej polityce. Kod
    # kontrolera ma go z digestem, a chart nadpisywał wersją z samym tagiem.
    ratelimit:
      image: docker.io/envoyproxy/ratelimit:0482748e@sha256:5fdd8e3ae335ab6d64316f8d2fd9a886830075cbbb40a1d8065c869275909162

# Domyślnie minAvailable: 0 — PDB, który zgadza się na usunięcie wszystkich
# replik naraz, czyli nie chroni niczego.
podDisruptionBudget:
  minAvailable: null
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

deployment:
  # Kontroler działa z wyborem lidera. Jego chwilowy brak nie przerywa ruchu —
  # proxy działają dalej z ostatnią konfiguracją — ale blokuje zmiany tras
  # i odnowienie certyfikatów w proxy. Druga replika skraca przejęcie.
  replicas: 2
  envoyGateway:
    # Bez limitu CPU (decyzja 16); limit pamięci jak w domyślnych wartościach.
    # Bez `cpu: null` — inaczej niż przy CoreDNS domyślne limity tego charta
    # nie mają CPU, więc null nie usuwałby klucza, tylko dodawał pusty.
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 1024Mi
  pod:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: envoy-gateway
            control-plane: envoy-gateway
        matchLabelKeys:
          - pod-template-hash

# Job generujący certyfikaty między kontrolerem a proxy (xDS po mTLS).
# Domyślnie bez zasobów — polityka z decyzji 16 by go odrzuciła.
certgen:
  job:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

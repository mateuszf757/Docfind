api:
  replicas: 2

  image:
    repository: ghcr.io/mateuszf757/docfind-api
    # Wymagany. Podaje go skrypt wdrożenia — domyślny "latest" oznaczałby,
    # że nie wiadomo, co stoi na klastrze, a /version jest bezużyteczne.
    tag: ""
    # Digest z publikacji w CI (sha256:…, wyjście zadania build). Podany daje
    # repository:tag@digest: węzeł pobiera obraz po digeście, a tag zostaje
    # dla czytelnika i etykiety wersji. Tak trafia na klaster dokładnie ten
    # obraz, który przeszedł pipeline — tag w rejestrze da się nadpisać.
    digest: ""
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    # Limit pamięci tak, limit CPU nie (docs/DECYZJE.md, decyzja 16).
    limits:
      memory: 256Mi

  # Przed SIGTERM kubelet odczekuje preStopSleepSeconds, żeby usunięcie poda
  # z endpointów Service zdążyło dotrzeć do kube-proxy na wszystkich węzłach.
  # Bez tego pod dostaje SIGTERM, a ruch jeszcze przez chwilę do niego płynie.
  preStopSleepSeconds: 5
  # Musi pokryć preStop i dokończenie żądań (config.service.shutdown_grace_seconds).
  # Chart odmawia renderowania, gdy jest za krótki — inaczej kubelet zabiłby
  # proces SIGKILL w trakcie dokańczania żądań.
  terminationGracePeriodSeconds: 15

  # Treść app.yml. Waliduje ją ten sam model Pydantic co przy starcie
  # aplikacji — `dft test` sprawdza wyrenderowany ConfigMap, więc zły
  # config zostaje odrzucony przed wdrożeniem, a nie w CrashLoopBackOff.
  config:
    service:
      host: 0.0.0.0
      port: 8000
      log_level: info
      shutdown_grace_seconds: 3
      # Dłużej niż route.upstreamIdleTimeoutSeconds — proxy musi zamknąć
      # bezczynne połączenie pierwsze. Odwrotnie proxy wysyła żądanie
      # połączeniem, które uvicorn właśnie zamyka, i dostaje reset (502/503).
      # Chart odmawia renderowania przy złej relacji.
      keep_alive_seconds: 75
    elasticsearch:
      url: http://elasticsearch:9200
      alias: docfind
      timeout_seconds: 5
    llm:
      backend: stub
      max_context: 8192
      max_fragments: 8

# Trasa z Gateway platformy do API (Gateway API, decyzja 11).
route:
  enabled: true
  # Musi należeć do nazwy hosta listenera HTTPS Gateway — inaczej trasa się nie
  # podepnie, a Gateway zwróci 404 dla każdego żądania.
  hostname: docfind.internal
  gateway:
    name: docfind
    namespace: gateway
    sectionName: https
  # Limit czasu całego żądania na proxy. Strumieniowanie odpowiedzi modelu
  # (Etap 7) może wymagać więcej — do przeglądu razem z drainTimeout proxy.
  requestTimeoutSeconds: 60
  # Polityki specyficzne dla Envoy Gateway (BackendTrafficPolicy). Klient z inną
  # implementacją Gateway API (Etap 10) ustawia false — chart nie może wymagać
  # CRD, których jego klaster nie ma.
  envoyGatewayPolicies: true
  # Po ilu sekundach bezczynności proxy zamyka połączenie do backendu.
  # Domyślnie w Envoyu godzina — dużo dłużej niż keep-alive uvicorna.
  upstreamIdleTimeoutSeconds: 60

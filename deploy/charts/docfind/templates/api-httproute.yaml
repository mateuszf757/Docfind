{{- if .Values.route.enabled }}
{{- include "docfind.route.validateIdleTimeout" . -}}
# Trasa z listenera HTTPS Gateway do Service API. Gateway należy do platformy
# i przyjmuje trasy tylko z przestrzeni nazw z etykietą, którą nadaje mu
# platforma (deploy/charts/platform, gateway.routeNamespaceLabel).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "docfind.api.fullname" . }}
  labels:
    {{- include "docfind.api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "docfind.api.fullname" . }}
          port: 80
      timeouts:
        request: {{ printf "%ds" (int .Values.route.requestTimeoutSeconds) }}
{{- if .Values.route.envoyGatewayPolicies }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "docfind.api.fullname" . }}
  labels:
    {{- include "docfind.api.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "docfind.api.fullname" . }}
  timeout:
    http:
      connectionIdleTimeout: {{ printf "%ds" (int .Values.route.upstreamIdleTimeoutSeconds) }}
{{- end }}
{{- end }}

{{- $es := .Values.api.secrets.externalSecret }}
{{- if $es.enabled }}
{{- $secretName := required "api.secrets.secretName jest wymagany przy externalSecret.enabled — Secret, który zrobi ESO i który montuje pod" .Values.api.secrets.secretName }}
# Sekrety aplikacji z OpenBao przez External Secrets Operator (decyzje 43
# i 44). SecretStore w przestrzeni wydania z rolą, która czyta tylko
# sekrety aplikacji — ExternalSecret z innej przestrzeni nazw go nie użyje.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $es.serviceAccount }}
  labels:
    {{- include "docfind.api.labels" . | nindent 4 }}
# Tylko tożsamość dla OpenBao: ESO wydaje sobie token tego konta
# (TokenRequest dla odbiorcy {{ $es.audience }}), żaden pod go nie montuje.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  labels:
    {{- include "docfind.api.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $es.server | quote }}
      path: {{ $es.mount | quote }}
      version: v2
      caBundle: {{ required "api.secrets.externalSecret.caBundle — CA serwera OpenBao (PEM w base64); bez niego ESO sprawdzałby certyfikat systemowymi CA" $es.caBundle | quote }}
      auth:
        kubernetes:
          mountPath: {{ $es.authMount | quote }}
          role: {{ $es.role | quote }}
          serviceAccountRef:
            name: {{ $es.serviceAccount }}
            audiences:
              - {{ $es.audience | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "docfind.api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    # Sekret usunięty w OpenBao nie zabiera plików działającym podom.
    deletionPolicy: Retain
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .key | quote }}
        property: {{ .property | quote }}
    {{- end }}
{{- end }}

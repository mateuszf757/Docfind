{{- include "docfind.api.validateGracePeriod" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docfind.api.fullname" . }}
  labels:
    {{- include "docfind.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Nowy pod wstaje i musi przejść readiness, zanim stary zostanie
      # zabity — liczba gotowych replik nigdy nie spada poniżej zadanej.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "docfind.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docfind.api.labels" . | nindent 8 }}
      annotations:
        # Zmiana konfiguracji zmienia nazwę ConfigMapy w wolumenie niżej, więc
        # sama wywołuje rollout (decyzja 63) — bez osobnej sumy w adnotacji.
        # X: preStop + dokańczanie żądań + 1 s. Bramka drainu mierzy
        # zakończenie eksmitowanego poda i porównuje je z tą liczbą.
        docfind.io/termination-budget-seconds: {{ include "docfind.api.terminationBudget" . | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Pliki sekretów należą do tej grupy (tryb 0440 niżej) — proces je
        # czyta, nikt inny w kontenerze nie.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # Repliki na różnych węzłach — inaczej drain jednego węzła zabiera
        # obie naraz i PodDisruptionBudget niczego nie ratuje.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "docfind.api.selectorLabels" . | nindent 14 }}
          # Liczy tylko pody z bieżącego ReplicaSetu. Bez tego podczas
          # rolling update stare pody zaburzają rozkład nowych.
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ required "api.image.tag jest wymagany — podaj tag obrazu, nie polegaj na latest" .Values.api.image.tag }}{{ with .Values.api.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            # Różnica między wdrożeniami idzie przez wdrożenie, a nie przez
            # obraz (decyzja 40): ten sam digest na stagingu i na produkcji.
            - name: DOCFIND_VERSION
              value: {{ .Values.api.version | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.api.config.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              # Natywna akcja kubeleta zamiast `exec: sleep` — nie zależy od
              # tego, czy w obrazie jest binarka sleep.
              sleep:
                seconds: {{ .Values.api.preStopSleepSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            # /healthz nie dotyka zależności, więc awaria Elasticsearcha nie
            # restartuje zdrowych podów API.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.api.secrets.secretName }}
            # Cały katalog, bez subPath: kubelet podmienia pliki Secreta przez
            # dowiązanie ..data, a montowanie przez subPath nie aktualizuje się
            # nigdy — rotacja nie dotarłaby do poda (decyzja 44).
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "docfind.api.configName" . }}
        # System plików kontenera jest tylko do odczytu; /tmp to jedyne
        # miejsce zapisu, ograniczone rozmiarem.
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- if .Values.api.secrets.secretName }}
        - name: secrets
          secret:
            secretName: {{ .Values.api.secrets.secretName }}
            defaultMode: 0440
        {{- end }}

# Identyfikator żądania nadawany na wejściu. Generate, nie PreserveOrGenerate:
# nagłówek X-Request-Id od klienta z internetu nie jest wiarygodny — przyjęty
# pozwoliłby zalać logi identyfikatorem cudzego żądania albo sklejać niezwiązane
# wpisy. Identyfikator nadany przez nasze proxy trafia do backendu (aplikacja
# odsyła go w odpowiedzi) i do logu dostępowego.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ .Values.gateway.name }}-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  headers:
    requestID: Generate

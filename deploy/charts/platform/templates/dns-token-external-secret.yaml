{{- if and .Values.acme.email .Values.acme.dnsZone }}
{{- $s := .Values.secretStore }}
# Token API Cloudflare dla wydawców ACME (DNS-01) — z OpenBao przez External
# Secrets Operator (decyzja 43). W gicie wskaźnik, wartość tylko w OpenBao;
# zapisuje ją `dft dns-token`.
#
# SecretStore w przestrzeni cert-managera, z rolą, która czyta tylko ten
# jeden sekret: ExternalSecret z innej przestrzeni nazw nie może się do niego
# odwołać (a ClusterSecretStore nie istnieje — jego CRD nie jest
# instalowane).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $s.serviceAccount }}
  namespace: cert-manager
  labels:
    {{- include "platform.labels" . | nindent 4 }}
# Konto tylko jako tożsamość dla OpenBao: ESO wydaje sobie jego token
# (TokenRequest dla odbiorcy {{ $s.audience }}), żaden pod go nie montuje.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $s.name }}
  namespace: cert-manager
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $s.server | quote }}
      path: {{ $s.mount | quote }}
      version: v2
      # Certyfikat OpenBao wystawia wewnętrzne CA; jego certyfikat leży
      # w tej samej przestrzeni nazw, więc SecretStore może go wskazać.
      caProvider:
        type: Secret
        name: docfind-root-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: {{ $s.authMount | quote }}
          role: {{ $s.dnsTokenRole | quote }}
          serviceAccountRef:
            name: {{ $s.serviceAccount }}
            audiences:
              - {{ $s.audience | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.acme.tokenSecretName }}
  namespace: cert-manager
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  # Po `dft dns-token` synchronizacja jest wymuszana od razu; okres to tylko
  # siatka bezpieczeństwa na zmianę wprost w OpenBao.
  refreshInterval: {{ $s.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $s.name }}
  target:
    name: {{ .Values.acme.tokenSecretName }}
    creationPolicy: Owner
    # Sekret usunięty w OpenBao nie zabiera tokenu wydawcom — odnowienie
    # certyfikatu w trakcie nie skończy się wiszącym wyzwaniem.
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: {{ $s.dnsTokenPath | quote }}
        property: api-token
{{- end }}

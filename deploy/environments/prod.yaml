# Środowisko prod — wydanie i eksploatacja w roli klienta. Klaster klienta
# powstaje w Etapie 10; do tego czasu definicja służy walidacji chartów
# (render z produkcyjnym Let's Encrypt) i promocji wydania, a każda operacja
# na klastrze jest odmawiana.
name: prod
stage: wydanie

cluster:
  provider: none

artifact:
  # Tylko wydanie: digest z main, który przeszedł bramki klastrowe w CI
  # i akceptację na stagingu, z numerem nadanym bez ponownego buildu
  # (decyzja 40) — dokładnie ten obraz, który stał na stagingu.
  sources: [registry]
  releasesOnly: true
  # Pochodzenie z main i atestacja wydania z tagu vX.Y.Z (stages/admission).
  attested: true

app:
  namespace: docfind
  release: docfind

gateway:
  namespace: gateway
  name: docfind
  hostname: prod.docfind.lol
  issuer: letsencrypt
  acmeZone: docfind.lol

operations:
  # Pusta lista: na produkcji nic nie biegnie automatycznie.
  allowed: []

# Środowisko staging — akceptacja: długo żyjący drugi klaster k3d na maszynie
# autora (rozstrzygnięcie z 2026-10-06), z topologią produkcji: 2 węzły
# robocze, 2 repliki, PDB — inaczej drain tutaj nic nie mówi o produkcji.
# Obrazy tylko z rejestru: digesty z main po zielonym ci. Digest, który
# przejdzie tu akceptację, zostaje wydaniem bez ponownego buildu
# (`./bin/mise run release -- vX.Y.Z`, decyzja 40).
# Platformę i aplikację wdraża Argo CD w klastrze (decyzje 46 i 81) z pakietu
# dostawy, który CI publikuje po bramkach klastra. `MISE_ENV=staging
# ./bin/mise run cluster:up` (bez obrazu) stawia CoreDNS i Argo CD, zakłada
# główną Application, prowadzi kroki startowe OpenBao, czeka, aż Argo wdroży
# najwyższą wersję pakietu z zakresu, i sprawdza ją na podach.
# Od Etapu 6 (pamięć, decyzja 2) okrojony stos albo wyłączany na czas pracy
# nad dev (`k3d cluster stop docfind-staging`).
name: staging
stage: akceptacja

cluster:
  provider: k3d
  name: docfind-staging
  context: k3d-docfind-staging
  kubeconfig: .cache/kubeconfig-staging
  apiServer: https://127.0.0.1:6552
  ports:
    api: 6552
    http: 8082
    https: 8445

artifact:
  sources: [registry]
  # Pochodzenie i SBOM w rejestrze, atestacja GitHuba z workflowu ci na main.
  attested: true

app:
  namespace: docfind
  release: docfind

delivery:
  argocd:
    bundle: ghcr.io/mateuszf757/charts/docfind-delivery
    # Każdy commit z main, który przeszedł bramki CI (decyzja 45). Cofnięcie:
    # przypięcie wersji tutaj (np. 0.4.1-dev.12), nie polecenie na klastrze.
    versions: ">=0.0.0-0"

gateway:
  namespace: gateway
  name: docfind
  hostname: staging.docfind.lol
  # Staging Let's Encrypt: ten sam łańcuch wydawania co produkcja (DNS-01,
  # Cloudflare), bez limitu, który wyczerpałyby wymuszone odnowienia.
  issuer: letsencrypt-staging
  acmeZone: docfind.lol

operations:
  # Bez cluster-delete: staging żyje długo, a jego odtworzenie to decyzja
  # autora, nie skutek uboczny polecenia wydanego w złym środowisku.
  # Drain i odnowienie biegną z blokadą (Lease) przed równoległym biegiem.
  # self-heal: bramka samonaprawy zmienia zasoby aplikacji, które Argo CD
  # ma przywrócić — bez przestoju (decyzja 46).
  allowed: [cluster-create, deploy, drain, tls-renew, dns-token, self-heal]

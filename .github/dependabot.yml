# Przypięcia bez mechanizmu aktualizacji starzeją się po cichu: digest bazy
# obrazu sprzed pół roku to baza z poprawkami bezpieczeństwa sprzed pół roku.
# Dependabot proponuje aktualizacje jako PR-y, które przechodzą ten sam
# pipeline co każda inna zmiana.
#
# Poza jego zasięgiem zostają przypięcia w ci/lib.sh (k3s, narzędzia, charty,
# obrazy narzędzi CI) — te aktualizuje się ręcznie, razem z ich sumami.
version: 2
updates:
  # Akcje przypięte SHA z komentarzem wersji — Dependabot aktualizuje oba.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Obrazy bazowe w FROM, razem z digestami.
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly

  # Zależności Pythona z uv.lock.
  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

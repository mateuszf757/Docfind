# Przypięcia bez mechanizmu aktualizacji starzeją się po cichu: digest bazy
# obrazu sprzed pół roku to baza z poprawkami bezpieczeństwa sprzed pół roku.
# Dependabot proponuje aktualizacje jako PR-y, które przechodzą ten sam
# pipeline co każda inna zmiana. Łatki — także odświeżenia digestu obrazu
# bazowego — są scalane automatycznie (.github/workflows/dependabot-auto-merge.yml),
# reszta czeka na przegląd.
#
# Poza jego zasięgiem zostają przypięcia w ci/lib.sh (k3s, BuildKit, obraz
# sondy, chart CoreDNS, commit schematów kubeconform) i narzędzia w mise.toml
# — Dependabot nie obsługuje mise. Te aktualizuje się ręcznie, razem z sumami.
#
# Grupy są rozdzielone według typu zmiany, bo auto-merge patrzy na najwyższą
# zmianę w PR-ze: grupa łącząca minor i patch dawałaby "minor" i żadna łatka
# w niej nie zostałaby scalona automatycznie.
#
# Cooldown: nowa wersja jest proponowana dopiero 7 dni po wydaniu, a major
# po 14. Skompromitowane wydania — jak tj-actions/changed-files w 2025 — bywają
# wykrywane i wycofywane w ciągu godzin albo dni; automatyczne scalanie świeżo
# wydanej łatki oznaczałoby zaufanie jej, zanim ktokolwiek ją obejrzał.
# Wcześniej łatki czekały 3 dni; zizmor (run-tests.sh) wymaga co najmniej 7,
# a koszt jest mały, bo aktualizacje bezpieczeństwa (z alertów Dependabota)
# cooldownem nie są objęte.
#
# Rozróżnienie dni według typu zmiany (semver-*-days) Dependabot przyjmuje tylko
# dla części ekosystemów — dla github-actions i docker odrzucił je przy parsowaniu,
# choć schemat dependabot.yml ze schemastore ich nie zabrania. Tam jest więc
# default-days, obejmujące wszystkie typy zmian.
#
# Po każdej zmianie tego pliku trzeba sprawdzić, czy Dependabot go przyjął
# (Insights → Dependency graph → Dependabot): lokalnie nie ma walidatora, który
# zna jego rzeczywiste reguły.
version: 2
updates:
  # Akcje przypięte SHA z komentarzem wersji — Dependabot aktualizuje oba.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-patch:
        update-types: [patch]
      actions-minor:
        update-types: [minor]

  # Obrazy bazowe w FROM, razem z digestami.
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Zależności Pythona z uv.lock.
  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      python-patch:
        update-types: [patch]
      python-minor:
        update-types: [minor]

name: ci

# PR      → lint, testy, build obrazu i jego warunki, a potem efemeryczny
#           klaster k3d z tym obrazem (archiwum z zadania build) i bramki
#           klastrowe; nic nie opuszcza pipeline'u
# main    → dodatkowo publikacja obrazu otagowanego commitem — jedyny build
#           tego commita (decyzja 40); klaster dostaje obraz z GHCR po
#           digeście — dowód, że opublikowany obraz to obraz sprawdzony;
#           po bramkach klastra chart z tym obrazem, który śledzi Argo CD
#           na stagingu (decyzja 45)
# tag v*  → wydanie bez builda (decyzja 40): tag z adnotacją zakłada
#           `./bin/mise run release` po akceptacji digestu z main na stagingu;
#           tu ten sam digest dostaje w rejestrze tag X.Y.Z i atestację
#           wydania, przechodzi skan podatności i po zgodzie autora trafia
#           na prod (zadanie promote, decyzja 38). Testy, build i klaster
#           przeszedł już na main, a bramki akceptacji — na stagingu
# nocą    → to samo co PR, na main: seria biegów tego samego kodu mówi, czy
#           bramka klastrowa migocze (okres próbny, decyzja 36)
#
# Obraz nie niesie wersji, tylko commit: wersję wdrożenia podaje chart
# zmienną DOCFIND_VERSION. Inaczej obraz dla produkcji nie byłby obrazem,
# który przeszedł staging.
#
# Publikacja niesie atestację BuildKitu (pochodzenie i SBOM z przypiętego
# generatora), a zadanie attest dodaje atestację GitHuba (Sigstore). Digest
# opublikowanego obrazu jest wyjściem zadania build i trafia do jego
# podsumowania — promuje się digest, nie tag. Zadanie vulns skanuje obraz
# (decyzja 37): na PR-ze blokuje nowe naprawialne HIGH/CRITICAL, na tagu
# każdą bez wyjątku, na main i nocą tylko raportuje — nocą do issue.
#
# Build obrazu biegnie także na PR-ach, bo zmiana zależności albo obrazu
# bazowego sprawdzona samymi testami jednostkowymi trafiłaby do main, zanim
# ktokolwiek zbudował z nią obraz. Tak wszedł PR #7 od Dependabota.
#
# Warstwy (decyzja 52): W1 — test, build, tools, negatives, równolegle;
# W2 — cluster i vulns. Reguła gałęzi main wymaga dwóch statusów:
# fast-feedback (W1) i integration (W2) — zadań zbierających z always(),
# które oceniają wyniki warstwy przez `ci:require`. Na nich czeka auto-merge
# łatek (dependabot-auto-merge.yml). Zadanie wymagane pominięte warunkiem
# raportuje sukces, więc wymaganym statusem nie jest żadne zadanie, które
# bramkę wykonuje. Zadania nie mają pola name: nazwa zadania to nazwa
# statusu.
#
# fetch-depth: 0 jest konieczne — git describe bez pełnej historii i tagów
# zwróci samo sha i wersja wdrożenia (DOCFIND_VERSION) przestanie rosnąć.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # GitHub uruchamia harmonogram na domyślnej gałęzi, z opóźnieniem w godzinach
  # szczytu; w repozytorium publicznym wyłącza go po 60 dniach bez aktywności.
  schedule:
    - cron: "17 3 * * *"
  # Noc na żądanie (decyzja 54): to samo co harmonogram, uruchamiane z UI albo
  # `gh workflow run ci.yml --ref main` — po zmianie nocnych zadań i gdy GitHub
  # pominął harmonogram.
  workflow_dispatch:

# Akcje przypięte pełnym SHA commita, nie tagiem. Tag akcji jest przesuwalny —
# tak w 2025 roku skompromitowano tj-actions/changed-files: napastnik przesunął
# tagi na złośliwy commit i każdy pipeline z @v… wykonał go ze swoimi sekretami.
# Komentarz z wersją czyta Dependabot, aktualizując przypięcia (.github/dependabot.yml).
#
# Runner też jest przypięty: ubuntu-latest przechodzi na Ubuntu 26.04 od
# 19.10.2026, z innym python3 i innymi wersjami narzędzi na obrazie.

# Najmniejsze uprawnienia na poziomie workflowu; zapis do rejestru dostają
# tylko zadania, które go używają, i żadne z nich nie biegnie na PR-ach:
# build-publish i chart (publikacja), release (tag wydania w rejestrze)
# i zadania atestacji (kopia obok artefaktu). Pilnuje tego dft check
# workflows (decyzja 49).
permissions:
  contents: read

# Osobna grupa na każdy commit main, każdy tag i na noc; na PR-ach jedna na
# gałąź, z anulowaniem — nowy push unieważnia poprzedni bieg.
#
# Wcześniej jedna grupa na ref (ci-<ref>), także dla main. GitHub trzyma w grupie
# najwyżej jeden oczekujący bieg (queue: single) i nowy oczekujący anuluje
# poprzedni — niezależnie od cancel-in-progress, które dotyczy tylko biegów
# w toku. Trzy szybkie scalenia: drugi bieg czekał, trzeci go anulował, a środkowy
# commit zostawał bez obrazu w rejestrze, bez atestacji i bez punktu odniesienia
# skanu dla PR-ów z nim jako bazą. Noc dzieliła tę grupę z pushem na main, więc
# mogła wypchnąć oczekującą publikację, i odwrotnie.
#
# Grupa na commit zamiast queue: max w jednej grupie dla main: publikacje różnych
# commitów nie dzielą stanu — każda pisze tylko swój tag <sha12>, który nigdy nie
# przeskakuje na inny obraz, i atestacje swojego digestu — więc mogą biec
# równolegle. queue: max nie da się też połączyć z cancel-in-progress: true,
# którego potrzebują PR-y, a dokumentacja nie mówi, czy walidator rozpoznaje
# ten konflikt, gdy cancel-in-progress jest wyrażeniem.
concurrency:
  group: >-
    ${{
      (github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref))
      || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ci-nightly')
      || (github.ref_type == 'tag' && format('ci-tag-{0}', github.ref))
      || format('ci-main-{0}', github.sha)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Na tagu wydania nie ma czego testować: tag wskazuje commit z main,
    # który przeszedł test, build i klaster, zanim wszedł na staging. Bez
    # test nie rusza też build — tag niczego nie buduje.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    # Domyślny limit to 360 minut — zawieszony krok trzymałby runner sześć
    # godzin. Typowy bieg trwa 2–3 minuty.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      # Narzędzia z mise.lock, z sumami — te same wersje co lokalnie, w tym Go
      # dla narzędzi z tools/ (nie Go z obrazu runnera i nie setup-go, który
      # domyślnie włącza pamięć podręczną modułów).
      - name: narzędzia (mise)
        env:
          # Tylko w tym kroku: mise sprawdza atestacje GitHuba przez API,
          # a bez tokenu limit to 60 żądań na godzinę na adres runnera.
          # Token tego zadania ma tylko odczyt.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./bin/mise install

      # Wersja uv z Dockerfile — jedynego miejsca, w którym uv jest przypięty
      # i które aktualizuje Dependabot. Bez tego setup-uv bierze najnowszego.
      # Czyta ją dft, a nie źródłowany skrypt Basha (decyzja 23).
      - name: przypięte wersje
        id: pins
        run: ./bin/mise run pins

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
          # Bez cache: workflow publikuje obrazy, a cache zapisany przez jeden
          # bieg jest odtwarzany w kolejnych (zizmor: cache-poisoning).
          # uv sync ze świeżego pobrania to kilka sekund.
          enable-cache: false

      # Jedno zadanie mise: spójność wersji, shellcheck, actionlint, zizmor,
      # kontrakt inżynierski, gitleaks na całej historii (stąd fetch-depth: 0 — w płytkim klonie
      # dft odmawia, bo skan widziałby jej część), charty, polityki, ruff,
      # mypy, pytest, schemat i bramki kodu Go
      # (gofmt, vet, staticcheck, testy z -race, govulncheck). Osobny krok
      # w CI, którego nie ma w zadaniu, to krok, który lokalnie nie biegnie.
      #
      # Zmianę ocenia się względem commita bazowego PR-a: govulncheck
      # blokuje tylko podatności, których nie ma w kodzie tools/ z commita
      # bazowego (decyzja 37), a pole chronione kontraktu zmienione bez
      # wpisu w DECYZJE jest czerwone (decyzja 50). Na main i nocą
      # govulncheck tylko raportuje — nowa podatność w bazie Go nie
      # zatrzymuje builda ani nocnego skanu obrazu, tylko trafia do issue.
      # Tryb wybiera dft ze zdarzenia (`dft test --event`), a nie warunek
      # powłoki tutaj — ten lokalnie nie biegnie i nie ma testu. Na push
      # BASE_SHA jest puste.
      - name: wersje, lint, kontrakt, typy, testy, polityki, schemat, kod Go
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./bin/mise run test -- --event "$EVENT" --base "$BASE_SHA"

      # Raport govulncheck także przy czerwonym kroku — wtedy jest
      # najbardziej potrzebny. Brak pliku znaczy, że test nie doszedł do
      # kodu Go; nocą zgłosi to vulns-issue.
      - name: raport podatności kodu Go
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raport-podatnosci-go
          path: .cache/reports/vulns-go.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  # Build obrazu na PR-ach i nocą: archiwum dla zadania cluster, token tylko
  # do odczytu. Uprawnienia dostaje zadanie, a nie krok — jedno zadanie
  # z publikacją przy push miało packages: write także na każdym PR-ze, z kodem
  # PR-a w środku (decyzja 49). Na push na main te same kroki (akcja
  # build-image) wykonuje build-publish, z prawem zapisu do rejestru.
  # Bez needs: test — biegnie równolegle z nim, więc sygnał z obrazu nie czeka
  # na lint i testy (decyzja 52). Kosztem jest build także na PR-ze
  # z czerwonym test; cluster i fast-feedback i tak czekają na oba.
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    # Typowy bieg trwa 4–5 minut; powtarzalność to drugi build.
    timeout-minutes: 30
    permissions:
      contents: read
    # Digest konfiguracji obrazu z archiwum dla zadań cluster i vulns.
    outputs:
      config: ${{ steps.image.outputs.config }}
    env:
      # Zadania mise biegną tu z samym Go. Domyślnie `mise run` doinstalowałby
      # brakujące narzędzia (kubectl, helm, …) — z zapytaniami do API GitHuba,
      # których to zadanie nie potrzebuje.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      # Akcja z obszaru roboczego, nie składnia $/…, którą zaleca zizmor:
      # actionlint 1.7.12 jej nie zna i odrzuca workflow. Ryzyko, przed którym
      # chroni $/… — akcja podmieniona w obszarze roboczym przez wcześniejszy
      # krok — tu nie zachodzi: jedyny wcześniejszy krok to checkout tego
      # samego commita. Do zmiany razem z aktualizacją actionlinta.
      - name: build i sprawdzenia obrazu, archiwum
        id: image
        uses: ./.github/actions/build-image # zizmor: ignore[self-repository]
        with:
          publish: "false"

  # Powtarzalność narzędzi Go: dwa buildy — z pamięcią podręczną i od zera —
  # dają te same bajty; sumy trafiają do podsumowania, do porównania
  # z lokalnymi. Osobne zadanie warstwy W1, równolegle z test i build
  # (decyzja 52).
  tools:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go (mise)
        run: ./bin/mise install go

      - name: powtarzalność narzędzi Go
        run: ./bin/mise run check:tools

  # Warianty, które bramki Etapu 1 muszą odrzucić, na prawdziwym obrazie:
  # obraz, który wstaje bez konfiguracji, PID 1 bez obsługi SIGTERM, żądanie
  # w locie dłuższe niż limit dokańczania. Bramka, której nie da się oblać,
  # niczego nie sprawdza. Własny build tego samego commita, równolegle
  # z build — w nim warianty czekałyby na drugi build powtarzalności
  # (decyzja 52). Wariant sprawdza bramkę, a nie obraz; że to ten sam obraz,
  # mówi powtarzalność builda.
  negatives:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    # Typowy bieg: build ~2 min, warianty ~2,5 min; każdy wariant ma budżet
    # z rejestru progów (contract.NegativeVariantBudget).
    timeout-minutes: 20
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Wersja z historii i tagów (git describe), jak w build.
          fetch-depth: 0
          persist-credentials: false

      - name: Go (mise)
        run: ./bin/mise install go

      - name: przypięte wersje
        id: pins
        run: ./bin/mise run pins

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ steps.pins.outputs.buildkit }}

      - name: build obrazu api
        run: ./bin/mise run build

      - name: warianty negatywne bramek
        run: ./bin/mise run test:negatives

  # Build i publikacja obrazu na push na main — jedyny build tego commita
  # (decyzja 40). Warunek wyklucza PR-y, więc token z prawem zapisu do
  # rejestru nie trafia do zadania z kodem PR-a (decyzja 49).
  build-publish:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'branch' && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Publikacja obrazu do GHCR — zadanie biegnie tylko na push na main.
      packages: write
    # Digest opublikowanego obrazu: promuje się digest, nie tag.
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: build, sprawdzenia i publikacja obrazu
        id: image
        uses: ./.github/actions/build-image # zizmor: ignore[self-repository]
        with:
          publish: "true"

  # Atestacja GitHuba (Sigstore) opublikowanego obrazu: podpis krótkotrwałym
  # certyfikatem wystawionym temu workflowowi, wpis w publicznym dzienniku
  # Rekor, kopia obok obrazu w GHCR. Osobne zadanie, bo id-token: write
  # pozwala każdemu krokowi zadania wybić token OIDC — tu jest tylko akcja
  # atestacji i logowanie do rejestru.
  attest:
    needs: build-publish
    if: ${{ !cancelled() && needs.build-publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Strona atestacji digestu — link w zapisie promocji (zadanie promote).
    outputs:
      url: ${{ steps.attest.outputs.attestation-url }}
    permissions:
      # Token OIDC — tożsamość workflowu dla certyfikatu Sigstore.
      id-token: write
      # Zapis atestacji w API atestacji GitHuba.
      attestations: write
      # Kopia atestacji obok obrazu w GHCR (push-to-registry).
      packages: write
    steps:
      - name: logowanie do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-name: ${{ needs.build-publish.outputs.image }}
          subject-digest: ${{ needs.build-publish.outputs.digest }}
          push-to-registry: true
          # Rekordy przechowywania istnieją tylko dla repozytoriów organizacji
          # i wymagałyby uprawnienia artifact-metadata.
          create-storage-record: false

  # Wydanie bez builda (decyzja 40). Tag z adnotacją zakłada u autora
  # `./bin/mise run release` po akceptacji na stagingu i zapisuje w nim
  # digest, który tam stał. dft czyta tag przez API GitHuba — checkout
  # zostawia lokalnie tag bez adnotacji — sprawdza, że wskazuje commit
  # obrazu, a obraz ma pochodzenie z main, i dopisuje w rejestrze tag X.Y.Z
  # do tego samego digestu.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Tag X.Y.Z w GHCR na digeście, który już tam jest.
      packages: write
      # Odczyt atestacji GitHuba obrazu z main (gh attestation verify).
      attestations: read
      # Biegi main commita wydania, ich zadania i artefakty — pakiet dowodów
      # (decyzja 53).
      actions: read
    outputs:
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.release.outputs.digest }}
      version: ${{ steps.release.outputs.version }}
      predicate-type: ${{ steps.release.outputs.predicate-type }}
      predicate: ${{ steps.release.outputs.predicate }}
      evidence-predicate-type: ${{ steps.release.outputs.evidence-predicate-type }}
      evidence-predicate: ${{ steps.release.outputs.evidence-predicate }}
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      - name: Go i gh (mise)
        run: ./bin/mise install go gh

      - name: logowanie do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tag wydania w rejestrze
        id: release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./bin/mise run release:image -- "$TAG"

  # Atestacje wydania (Sigstore): digest z main jest wydaniem X.Y.Z, a zapis
  # akceptacji na stagingu jest w predykacie; druga to pakiet dowodów. Podpis
  # wiąże je z tagiem vX.Y.Z tego workflowu — promocja wymaga obu
  # (stages/admission), więc obraz z main bez wydania na prod nie wejdzie.
  # Osobne zadanie z tych samych powodów co attest.
  attest-release:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Strona atestacji wydania — link w zapisie promocji (zadanie promote).
    outputs:
      url: ${{ steps.attest.outputs.attestation-url }}
    permissions:
      # Token OIDC — tożsamość workflowu dla certyfikatu Sigstore.
      id-token: write
      # Zapis atestacji w API atestacji GitHuba.
      attestations: write
      # Kopia atestacji obok obrazu w GHCR (push-to-registry).
      packages: write
    steps:
      - name: logowanie do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-name: ${{ needs.release.outputs.image }}
          subject-digest: ${{ needs.release.outputs.digest }}
          predicate-type: ${{ needs.release.outputs.predicate-type }}
          predicate: ${{ needs.release.outputs.predicate }}
          push-to-registry: true
          create-storage-record: false

      # Pakiet dowodów wydania (decyzja 53): bieg main commita z wynikami
      # zadań i skrótami artefaktów, wersje narzędzi. Biegi, checki
      # i artefakty Actions znikają najpóźniej po 90 dniach; podpisany pakiet
      # obok obrazu żyje tyle co obraz. Promocja go wymaga.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.release.outputs.image }}
          subject-digest: ${{ needs.release.outputs.digest }}
          predicate-type: ${{ needs.release.outputs.evidence-predicate-type }}
          predicate: ${{ needs.release.outputs.evidence-predicate }}
          push-to-registry: true
          create-storage-record: false

  # Podatności obrazu (decyzja 37): OSV-Scanner z bazami pobranymi raz na
  # bieg, polityka i wyjątki z datą w dft. Na PR-ze punktem odniesienia jest
  # obraz z main dla commita bazowego — blokuje tylko to, co PR wnosi.
  vulns:
    needs: [test, build, build-publish, release]
    # Obraz przychodzi z jednego z trzech zadań: archiwum z build (PR, noc —
    # jak cluster, także po zielonym test), digest z build-publish (push na
    # main) albo wydanie z release (tag, bez test).
    if: ${{ !cancelled() && ((needs.test.result == 'success' && needs.build.result == 'success') || needs.build-publish.result == 'success' || needs.release.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Tylko Go (dft) i OSV-Scanner — reszta narzędzi niepotrzebna.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historia dla punktu odniesienia na PR-ze: gdy obrazu commita
          # bazowego jeszcze nie ma w rejestrze (main publikuje go ok. 10 min
          # po scaleniu), skan bierze obraz najbliższego przodka (decyzja 51).
          fetch-depth: 0
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      # mise sprawdza sumę z mise.lock i pochodzenie SLSA OSV-Scannera.
      - name: Go i OSV-Scanner (mise)
        run: ./bin/mise install go osv-scanner

      - name: archiwum obrazu z zadania build
        if: github.event_name != 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: obraz-api
          path: ${{ runner.temp }}/obraz

      - name: skan obrazu z PR-a względem obrazu z main
        if: github.event_name == 'pull_request'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/obraz/image-api.tar
          CONFIG_DIGEST: ${{ needs.build.outputs.config }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./bin/mise run check:vulns -- --image-archive "$IMAGE_ARCHIVE" --config-digest "$CONFIG_DIGEST" --baseline-commit "$BASE_SHA"

      - name: skan nocny obrazu z main (raport)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/obraz/image-api.tar
          CONFIG_DIGEST: ${{ needs.build.outputs.config }}
        run: ./bin/mise run check:vulns -- --image-archive "$IMAGE_ARCHIVE" --config-digest "$CONFIG_DIGEST" --report-only

      - name: skan opublikowanego obrazu z main (raport)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          IMAGE: ${{ needs.build-publish.outputs.image }}@${{ needs.build-publish.outputs.digest }}
        run: ./bin/mise run check:vulns -- --image "$IMAGE" --report-only

      # Wydanie z naprawialną HIGH/CRITICAL bez wyjątku nie przechodzi —
      # i nie trafi do promocji. Skan biegnie w chwili wydania, a nie
      # builda: podatność opublikowana między buildem na main a tagiem też
      # zatrzymuje promocję.
      - name: skan obrazu wydania
        if: github.ref_type == 'tag'
        env:
          IMAGE: ${{ needs.release.outputs.image }}@${{ needs.release.outputs.digest }}
        run: ./bin/mise run check:vulns -- --image "$IMAGE"

      # Raport z wersją baz — także po porażce. Katalog .cache jest ukryty;
      # w raporcie nie ma sekretów.
      - name: raport podatności obrazu
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raport-podatnosci-api
          path: .cache/reports/vulns-api.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  # Nocą wynik skanu idzie do issue, a nie na czerwono na main: podatność
  # opublikowana w nocy w pakiecie obrazu nie jest porażką ostatniego commita.
  #
  # Jedno issue na oba skany: obrazu (zadanie vulns) i kodu narzędzi Go
  # (govulncheck w zadaniu test). Zadanie biegnie także wtedy, gdy któryś
  # skan się nie wykonał — vulns zależy od test i build, więc czerwony test
  # pomijałby go razem z issue. Brak raportu dft zgłasza wtedy w issue
  # i wynikiem niespełnionym, a issue nie zamyka.
  vulns-issue:
    needs: [test, vulns]
    # Noc: harmonogram albo uruchomienie ręczne — jedyne zdarzenia poza PR-em
    # i push. Koniunkcja wykluczeń, a nie alternatywa: regułę uprawnień
    # (decyzja 49) przekonuje tylko jawne wykluczenie pull_request.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Otwarcie, aktualizacja albo zamknięcie issue nocnego skanu.
      issues: write
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      - name: Go i gh (mise)
        run: ./bin/mise install go gh

      # Wzorzec zamiast nazw: brak artefaktu skanu, który się nie wykonał,
      # nie przerywa kroku. Których raportów oczekiwać, wie dft.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: raport-podatnosci-*
          merge-multiple: true
          path: ${{ runner.temp }}/raporty

      - name: issue skanu nocnego
        env:
          GH_TOKEN: ${{ github.token }}
          REPORTS: ${{ runner.temp }}/raporty
        run: |
          # Bez żadnego artefaktu katalog nie powstaje.
          mkdir -p "$REPORTS"
          ./bin/mise run vulns:issue -- "$REPORTS"

  # Promocja wydania na prod (decyzje 38 i 40): ten sam digest, który
  # zbudowano na main, przeszedł tam bramki klastrowe, potem akceptację na
  # stagingu i teraz skan podatności, po zgodzie autora w Environment
  # production (recenzent, tylko tagi v* — .github/environments). Zadanie
  # z environment: zapisuje wdrożenie (GitHub Deployment z linkiem do
  # atestacji wydania). Do Etapu 10 nie ma klastra klienta — po weryfikacji
  # zadanie podaje instalację, a nie instaluje.
  promote:
    needs: [release, attest-release, vulns]
    # Domyślne success() patrzy na wszystkich przodków, nie tylko na needs:
    # na tagu pominięty build (przodek vulns) pomijał promote, choć release,
    # attest-release i vulns były zielone — wydanie v0.3.1 nie miało ani
    # zgody, ani zapisu (bieg 38164714816). Stąd !cancelled() i jawne wyniki
    # bezpośrednich zależności (decyzja 47).
    if: >-
      ${{
        !cancelled() && github.ref_type == 'tag'
        && needs.release.result == 'success'
        && needs.attest-release.result == 'success'
        && needs.vulns.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ needs.attest-release.outputs.url }}
    permissions:
      contents: read
      # Odczyt atestacji GitHuba obrazu (gh attestation verify).
      attestations: read
      # Odczyt reguł środowiska production: dft odmawia, gdy nie wymaga zgody.
      actions: read
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      - name: Go i gh (mise)
        run: ./bin/mise install go gh

      - name: weryfikacja i zapis promocji
        env:
          IMAGE: ${{ needs.release.outputs.image }}@${{ needs.release.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: ./bin/mise run promote -- "$IMAGE" "$RELEASE_TAG"

  # Środowisko ci (deploy/environments/ci.yaml): efemeryczny klaster k3d na
  # runnerze z obrazem z zadania build — nigdy budowanym od nowa — i te same
  # bramki klastrowe co lokalnie: tożsamość na każdym podzie, drain każdego
  # węzła z repliką, odnowienie certyfikatu pod ruchem. Bez sekretów: TLS na
  # własnym CA, więc działa także na PR-ach od Dependabota i z forków. Na
  # tagu nie biegnie: digest wydania przeszedł ten klaster na main, a potem
  # staging.
  # Po okresie próbnym (decyzja 36) wymagany przez regułę main pośrednio:
  # przez zadanie zbierające integration (decyzja 52). Klaster znika razem
  # z maszyną runnera.
  cluster:
    needs: [test, build, build-publish, attest]
    # Na PR-ze i nocą obraz to archiwum z build, a klaster czeka też na test:
    # build trwa dłużej, więc nic to nie kosztuje, a PR z czerwonym test nie
    # zajmuje runnera na 20 minut (decyzja 52). Po publikacji — digest
    # z build-publish (ten czeka na test), i wtedy cluster czeka na
    # atestację, którą sprawdza.
    if: ${{ !cancelled() && ((needs.test.result == 'success' && needs.build.result == 'success') || (needs.build-publish.result == 'success' && needs.attest.result == 'success')) }}
    runs-on: ubuntu-24.04
    # Typowy bieg: utworzenie klastra i platforma ~5 minut, bramki ~4.
    timeout-minutes: 30
    permissions:
      # Tylko odczyt kodu: obraz przychodzi z artefaktu tego biegu albo
      # z publicznego rejestru, a zadanie niczego nigdzie nie zapisuje.
      contents: read
      # Odczyt atestacji GitHuba obrazu z GHCR (gh attestation verify).
      attestations: read
    env:
      # mise nakłada mise.ci.toml: DOCFIND_ENV=ci dla dft i KUBECONFIG
      # klastra CI dla kubectl.
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      - name: narzędzia (mise)
        env:
          # Tylko w tym kroku, tylko do odczytu: mise sprawdza atestacje
          # GitHuba przez API, a bez tokenu limit to 60 żądań na godzinę.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./bin/mise install

      - name: archiwum obrazu z zadania build
        if: github.event_name != 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: obraz-api
          path: ${{ runner.temp }}/obraz

      # Klaster k3d z deploy/k3d/cluster.yaml z nazwą i portami z definicji,
      # platforma, obraz i chart; na końcu tożsamość na każdym podzie.
      # Archiwum musi mieć konfigurację obrazu sprawdzonego w zadaniu build.
      - name: klaster i wdrożenie archiwum z zadania build
        if: github.event_name != 'push'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/obraz/image-api.tar
          CONFIG_DIGEST: ${{ needs.build.outputs.config }}
        run: ./bin/mise run cluster:up -- --image-archive "$IMAGE_ARCHIVE" --config-digest "$CONFIG_DIGEST"

      # Po publikacji: obraz z rejestru po digeście z wyjść zadania build,
      # sprawdzony jak po publikacji (indeks z atestacją, jeden obraz).
      # Środowisko ci wymaga atestacji (artifact.attested): pochodzenie i SBOM
      # w rejestrze i atestacja GitHuba z tego workflowu — gh czyta ją z API.
      - name: klaster i wdrożenie obrazu z GHCR po digeście
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ needs.build-publish.outputs.image }}@${{ needs.build-publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: ./bin/mise run cluster:up -- --image "$IMAGE"

      - name: drain każdego węzła z repliką
        run: ./bin/mise run cluster:drain

      # Po drainach: OpenBao przeżył wyjazd replik z każdego węzła (PDB,
      # kworum Raft z dwóch), każda replika odpieczętowana i głosująca,
      # a usunięty pod standby wraca sam — bez człowieka (decyzja 42).
      - name: OpenBao po drainach
        run: ./bin/mise run check:openbao

      # Warunek Etapu 4 (decyzja 44): nowy token metryk z OpenBao przez ESO
      # dociera do każdego poda API bez restartu — najpierw obok starego,
      # potem sam. Naturalna droga, bez wymuszania synchronizacji: ok. 1 min
      # na fazę.
      - name: rotacja sekretu do podów
        run: ./bin/mise run cluster:rotation

      - name: odnowienie certyfikatu pod ruchem
        run: ./bin/mise run cluster:tls

      # Drain przeniósł repliki: nowe pody też mają mieć ten obraz.
      - name: tożsamość na podach po drainach
        run: ./bin/mise run cluster:identity

      # Noc (decyzja 60): rolling update pod ruchem przez bramę — przestój
      # ≤ Z, zero nieudanych — i warianty, które API server ma odrzucić
      # (sonda bez securityContext). Na PR-ach koszt bez nowego sygnału:
      # zmiana charta albo aplikacji przechodzi drain na tej samej ścieżce.
      - name: rolling update pod ruchem (noc)
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: ./bin/mise run cluster:rollout

      - name: warianty negatywne na klastrze (noc)
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: ./bin/mise run test:cluster

      # Także po porażce — klaster znika z maszyną runnera, a przyczyna jest
      # w jego stanie: zdarzenia, logi (także sprzed restartu), zasoby
      # platformy, logi kontenerów węzłów.
      - name: dowody z klastra
        if: always()
        timeout-minutes: 5
        run: ./bin/mise run cluster:evidence

      # Raporty bramek, logi sondy z czasami i dowody. Katalog .cache jest
      # ukryty, stąd include-hidden-files; sekretów w nim nie ma — zadanie
      # żadnych nie dostaje, a kubeconfig leży poza tym katalogiem.
      - name: artefakt z dowodami
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dowody-cluster
          path: .cache/reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # Chart aplikacji z obrazem tego commita po digeście, jako artefakt OCI
  # w GHCR (decyzja 45). Argo CD na stagingu wdraża najwyższą wersję z zakresu
  # kilka minut po publikacji, więc publikacja to promocja na staging — stąd
  # osobne zadanie po bramkach klastra na obrazie z GHCR, a nie krok w build.
  # Commit, na którym bramka padła, nie trafia na staging; trafi następny
  # zielony. Powtarzalny jak obraz: ten sam commit, ten sam digest. dft
  # pobiera go z rejestru po wysłaniu i sprawdza wersję i obraz w wartościach.
  chart:
    # Także po zadaniach W1 spoza ścieżki obrazu: warianty negatywne
    # i powtarzalność narzędzi — bramka, której nie da się oblać, nie
    # dopuszcza commita na staging (decyzja 52).
    needs: [build-publish, attest, cluster, negatives, tools]
    if: >-
      ${{
        !cancelled() && github.event_name == 'push' && github.ref_type == 'branch'
        && needs.build-publish.result == 'success'
        && needs.attest.result == 'success'
        && needs.cluster.result == 'success'
        && needs.negatives.result == 'success'
        && needs.tools.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Publikacja charta do GHCR.
      packages: write
    outputs:
      chart: ${{ steps.chart.outputs.chart }}
      digest: ${{ steps.chart.outputs.chart-digest }}
    env:
      # Jak w build: zadanie z packages: write uruchamia tylko dft zbudowany
      # tutaj, z samym Go.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Wersja charta z historii i tagów (git describe), jak w build.
          fetch-depth: 0
          persist-credentials: false

      - name: Go (mise)
        run: ./bin/mise install go

      - name: logowanie do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publikacja charta (OCI)
        id: chart
        env:
          IMAGE: ${{ needs.build-publish.outputs.image }}@${{ needs.build-publish.outputs.digest }}
        run: ./bin/mise run chart:publish -- --image "$IMAGE"

  # Atestacja GitHuba charta — ta sama tożsamość workflowu i commita co
  # obraz. Osobne zadanie z tego samego powodu co attest: id-token: write
  # tylko tam, gdzie jest sama akcja atestacji. Klient (Etap 10) i weryfikacja
  # przy przyjęciu (Etap 9) sprawdzą ją tak samo:
  # gh attestation verify oci://…/charts/docfind@sha256:….
  attest-chart:
    needs: chart
    if: ${{ !cancelled() && needs.chart.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: logowanie do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.chart.outputs.chart }}
          subject-digest: ${{ needs.chart.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # Wymagane statusy reguły main (decyzja 52): zadania zbierające warstwy.
  # always() — biegną także wtedy, gdy zadanie warstwy zawiodło, zostało
  # anulowane albo pominięte, i są wtedy czerwone: zadanie wymagane pominięte
  # warunkiem raportuje sukces. Wynik ocenia dft (`ci:require`) z wyników
  # needs, a nie wyrażenie w YAML-u — reguła ma test. Tylko na PR-ach: reguła
  # sprawdza statusy przy scaleniu, a na main build zastępuje build-publish.
  fast-feedback:
    needs: [test, build, tools, negatives]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go (mise)
        run: ./bin/mise install go

      - name: wynik warstwy W1
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: ./bin/mise run ci:require

  integration:
    needs: [cluster, vulns]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go (mise)
        run: ./bin/mise install go

      - name: wynik warstwy W2
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: ./bin/mise run ci:require

  # Dryf ustawień repozytorium (decyzja 54): reguły działające na main
  # i środowiska GitHuba porównane z plikami w .github. Zmiana w UI albo plik
  # niezastosowany po scaleniu — czerwona noc. Endpointy reguł i środowisk
  # czyta każdy z dostępem do repozytorium, więc wystarcza token zadania
  # tylko do odczytu.
  settings-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go i gh (mise)
        run: ./bin/mise install go gh

      - name: ustawienia w GitHubie zgodne z plikami
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./bin/mise run repo:settings -- --check

  # Zdrowie main (decyzja 54): czerwony main dłużej niż doba i noc, która nie
  # przyszła, w jednym issue — nie na czerwono, bo czerwony bieg zgłaszający
  # czerwony main podtrzymywałby czerwień. Także na push: noc, która przestała
  # przychodzić, sama tego nie zgłosi.
  main-health:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Biegi workflowu ci na main.
      actions: read
      # Issue „Zdrowie main” — otwarcie, aktualizacja, zamknięcie.
      issues: write
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go i gh (mise)
        run: ./bin/mise install go gh

      - name: zdrowie main do issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./bin/mise run ci:main-health

  # Budżety warstw (decyzja 57): p50 i p95 wall-clock każdej warstwy z 20
  # ostatnich zielonych biegów PR-ów, push i nocy, kolejka osobno, czasy
  # zadań — w podsumowaniu nocy. Bez --enforce: budżet W1 jest jeszcze
  # życzeniem (§3.1), więc przekroczenie ostrzega zamiast czerwienić noc.
  budget:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Biegi workflowu ci i ich zadania.
      actions: read
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go i gh (mise)
        run: ./bin/mise install go gh

      - name: budżety warstw
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./bin/mise run ci:budget

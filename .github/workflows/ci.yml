name: ci

# PR      → lint, testy, build obrazu i jego warunki, a potem efemeryczny
#           klaster k3d z tym obrazem (archiwum z zadania build) i bramki
#           klastrowe; nic nie opuszcza pipeline'u
# main    → dodatkowo publikacja obrazu otagowanego commitem — jedyny build
#           tego commita (decyzja 40); klaster dostaje obraz z GHCR po
#           digeście — dowód, że opublikowany obraz to obraz sprawdzony
# tag v*  → wydanie bez builda (decyzja 40): tag z adnotacją zakłada
#           `./bin/mise run release` po akceptacji digestu z main na stagingu;
#           tu ten sam digest dostaje w rejestrze tag X.Y.Z i atestację
#           wydania, przechodzi skan podatności i po zgodzie autora trafia
#           na prod (zadanie promote, decyzja 38). Testy, build i klaster
#           przeszedł już na main, a bramki akceptacji — na stagingu
# nocą    → to samo co PR, na main: seria biegów tego samego kodu mówi, czy
#           bramka klastrowa migocze (okres próbny, decyzja 36)
#
# Obraz nie niesie wersji, tylko commit: wersję wdrożenia podaje chart
# zmienną DOCFIND_VERSION. Inaczej obraz dla produkcji nie byłby obrazem,
# który przeszedł staging.
#
# Publikacja niesie atestację BuildKitu (pochodzenie i SBOM z przypiętego
# generatora), a zadanie attest dodaje atestację GitHuba (Sigstore). Digest
# opublikowanego obrazu jest wyjściem zadania build i trafia do jego
# podsumowania — promuje się digest, nie tag. Zadanie vulns skanuje obraz
# (decyzja 37): na PR-ze blokuje nowe naprawialne HIGH/CRITICAL, na tagu
# każdą bez wyjątku, na main i nocą tylko raportuje — nocą do issue.
#
# Build obrazu biegnie także na PR-ach, bo zmiana zależności albo obrazu
# bazowego sprawdzona samymi testami jednostkowymi trafiłaby do main, zanim
# ktokolwiek zbudował z nią obraz. Tak wszedł PR #7 od Dependabota. Zadania
# test i build są wymaganymi sprawdzeniami reguły gałęzi main — na nich czeka
# auto-merge łatek (dependabot-auto-merge.yml). Dlatego zadania nie mają pola
# name: nazwa zadania to nazwa statusu, którego wymaga reguła.
#
# fetch-depth: 0 jest konieczne — git describe bez pełnej historii i tagów
# zwróci samo sha i wersja wdrożenia (DOCFIND_VERSION) przestanie rosnąć.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # GitHub uruchamia harmonogram na domyślnej gałęzi, z opóźnieniem w godzinach
  # szczytu; w repozytorium publicznym wyłącza go po 60 dniach bez aktywności.
  schedule:
    - cron: "17 3 * * *"

# Akcje przypięte pełnym SHA commita, nie tagiem. Tag akcji jest przesuwalny —
# tak w 2025 roku skompromitowano tj-actions/changed-files: napastnik przesunął
# tagi na złośliwy commit i każdy pipeline z @v… wykonał go ze swoimi sekretami.
# Komentarz z wersją czyta Dependabot, aktualizując przypięcia (.github/dependabot.yml).
#
# Runner też jest przypięty: ubuntu-latest przechodzi na Ubuntu 26.04 od
# 19.10.2026, z innym python3 i innymi wersjami narzędzi na obrazie.

# Najmniejsze uprawnienia na poziomie workflowu; zapis do rejestru dostają
# tylko zadania, które go używają: build (publikacja), release (tag wydania
# w rejestrze) i zadania atestacji (kopia obok obrazu).
permissions:
  contents: read

# Osobna grupa na każdy commit main, każdy tag i na noc; na PR-ach jedna na
# gałąź, z anulowaniem — nowy push unieważnia poprzedni bieg.
#
# Wcześniej jedna grupa na ref (ci-<ref>), także dla main. GitHub trzyma w grupie
# najwyżej jeden oczekujący bieg (queue: single) i nowy oczekujący anuluje
# poprzedni — niezależnie od cancel-in-progress, które dotyczy tylko biegów
# w toku. Trzy szybkie scalenia: drugi bieg czekał, trzeci go anulował, a środkowy
# commit zostawał bez obrazu w rejestrze, bez atestacji i bez punktu odniesienia
# skanu dla PR-ów z nim jako bazą. Noc dzieliła tę grupę z pushem na main, więc
# mogła wypchnąć oczekującą publikację, i odwrotnie.
#
# Grupa na commit zamiast queue: max w jednej grupie dla main: publikacje różnych
# commitów nie dzielą stanu — każda pisze tylko swój tag <sha12>, który nigdy nie
# przeskakuje na inny obraz, i atestacje swojego digestu — więc mogą biec
# równolegle. queue: max nie da się też połączyć z cancel-in-progress: true,
# którego potrzebują PR-y, a dokumentacja nie mówi, czy walidator rozpoznaje
# ten konflikt, gdy cancel-in-progress jest wyrażeniem.
concurrency:
  group: >-
    ${{
      (github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref))
      || (github.event_name == 'schedule' && 'ci-nightly')
      || (github.ref_type == 'tag' && format('ci-tag-{0}', github.ref))
      || format('ci-main-{0}', github.sha)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Na tagu wydania nie ma czego testować: tag wskazuje commit z main,
    # który przeszedł test, build i klaster, zanim wszedł na staging. Bez
    # test nie rusza też build — tag niczego nie buduje.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    # Domyślny limit to 360 minut — zawieszony krok trzymałby runner sześć
    # godzin. Typowy bieg trwa 2–3 minuty.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      # Narzędzia z mise.lock, z sumami — te same wersje co lokalnie, w tym Go
      # dla narzędzi z tools/ (nie Go z obrazu runnera i nie setup-go, który
      # domyślnie włącza pamięć podręczną modułów).
      - name: narzędzia (mise)
        env:
          # Tylko w tym kroku: mise sprawdza atestacje GitHuba przez API,
          # a bez tokenu limit to 60 żądań na godzinę na adres runnera.
          # Token tego zadania ma tylko odczyt.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./bin/mise install

      # Wersja uv z Dockerfile — jedynego miejsca, w którym uv jest przypięty
      # i które aktualizuje Dependabot. Bez tego setup-uv bierze najnowszego.
      # Czyta ją dft, a nie źródłowany skrypt Basha (decyzja 23).
      - name: przypięte wersje
        id: pins
        run: ./bin/mise run pins

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
          # Bez cache: workflow publikuje obrazy, a cache zapisany przez jeden
          # bieg jest odtwarzany w kolejnych (zizmor: cache-poisoning).
          # uv sync ze świeżego pobrania to kilka sekund.
          enable-cache: false

      # Jedno zadanie mise: spójność wersji, shellcheck, actionlint, zizmor,
      # charty, polityki, ruff, mypy, pytest, schemat i bramki kodu Go
      # (gofmt, vet, staticcheck, testy z -race, govulncheck). Osobny krok
      # w CI, którego nie ma w zadaniu, to krok, który lokalnie nie biegnie.
      - name: wersje, lint, typy, testy, polityki, schemat, kod Go
        run: ./bin/mise run test

      # Dwa buildy narzędzi Go — z pamięcią podręczną i od zera — dają te
      # same bajty. Sumy trafiają do podsumowania, do porównania z lokalnymi.
      - name: powtarzalność narzędzi Go
        run: ./bin/mise run check:tools

  build:
    needs: test
    runs-on: ubuntu-24.04
    # Typowy bieg trwa 1–2 minuty; publikacja i powtarzalność to dwa buildy.
    timeout-minutes: 30
    permissions:
      contents: read
      # Publikacja obrazu do GHCR — tylko przy push, ale zadanie jest jedno.
      packages: write
    # image i digest puste poza push, bo nic nie jest publikowane; config —
    # digest konfiguracji obrazu z archiwum dla zadania cluster (PR, nocą).
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      config: ${{ steps.build.outputs.config }}
    env:
      # Zadania mise biegną tu z samym Go. Domyślnie `mise run` doinstalowałby
      # brakujące narzędzia (kubectl, helm, …) — z zapytaniami do API GitHuba,
      # których to zadanie nie potrzebuje.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      # Tylko Go, z sumą z mise.lock: dft budowany ze źródeł w tym zadaniu,
      # a nie binarka z zadania test — zadanie z packages: write
      # uruchamiałoby program zbudowany gdzie indziej. Go pobierany
      # z dl.google.com, więc bez tokenu: token tego zadania ma prawo zapisu
      # do rejestru.
      - name: Go (mise)
        run: ./bin/mise install go

      # Obraz BuildKit z ci/pins.env. Bez przypięcia sterownik docker-container
      # bierze przesuwalny tag, a od wersji BuildKit (i wbudowanego w nią
      # frontendu Dockerfile) zależy, czy obraz z CI jest bajt w bajt taki
      # jak lokalny (decyzja 21).
      - name: przypięte wersje
        id: pins
        run: ./bin/mise run pins

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ steps.pins.outputs.buildkit }}

      - name: build obrazu api
        id: build
        env:
          # Bez publikacji obraz idzie do zadania cluster jako archiwum
          # `docker save` — w rejestrze go nie ma. dft zapisuje do wyjść
          # kroku digest jego konfiguracji.
          ARCHIVE: ${{ github.event_name != 'push' && format('{0}/image-api.tar', runner.temp) || '' }}
        run: ./bin/mise run build

      # Odświeżenie digestu python:3.14-alpine od Dependabota jest scalane
      # automatycznie, ale może przynieść nowe wydanie Alpine. Tu zamienia się
      # to w czerwony build, dopóki człowiek nie podbije DF_BASE_ALPINE.
      - name: baza obrazu zgodna z zapisaną
        run: ./bin/mise run check:base

      # Testy jednostkowe na tej samej bazie co produkcja: musl i ta sama łatka
      # Pythona. Zadanie test uruchamia je na glibc runnera.
      - name: testy na obrazie (musl)
        run: ./bin/mise run test:image

      # Warunki zakończenia Etapu 1 sprawdzane na artefakcie, nie na kodzie:
      # rozmiar obrazu, odmowa startu bez konfiguracji i ze złą konfiguracją,
      # koszt zamykania, żądanie w locie przy SIGTERM. Raport JSON zostaje
      # w .cache/reports.
      - name: warunki zakończenia etapu
        run: ./bin/mise run check:runtime

      # Warianty, które bramki muszą odrzucić, na tym samym obrazie: obraz,
      # który wstaje bez konfiguracji, PID 1 bez obsługi SIGTERM, żądanie
      # w locie dłuższe niż limit dokańczania. Bramka, której nie da się
      # oblać, niczego nie sprawdza.
      - name: warianty negatywne bramek
        run: ./bin/mise run test:negatives

      # Build z pamięcią podręczną i build od zera muszą dać identyczny obraz.
      # Publikowany digest da się wtedy niezależnie odtworzyć z commita, a zmiana
      # digestu zawsze oznacza zmianę zawartości. Porównanie warstwa po
      # warstwie robi dft (port dawnego compare_oci.py) — bez uv i Pythona.
      - name: powtarzalność builda
        run: ./bin/mise run check:reproducible

      # Archiwum dopiero po wszystkich sprawdzeniach: zadanie cluster dostaje
      # obraz, który je przeszedł, i porówna jego konfigurację z digestem
      # z wyjść tego zadania. Jeden dzień — to tylko przekazanie między
      # zadaniami tego samego biegu.
      - name: archiwum obrazu dla zadania cluster
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obraz-api
          path: ${{ runner.temp }}/image-api.tar
          retention-days: 1
          if-no-files-found: error

      # Logowanie i publikacja tylko przy push, po wszystkich sprawdzeniach:
      # dane logowania leżą w ~/.docker/config.json od tego kroku do końca
      # zadania, więc nie ma ich tam, gdy biegną build, testy i bramki.
      # Na PR-ach nie ma czego publikować, a PR-y od Dependabota i tak
      # dostają token tylko do odczytu.
      - name: logowanie do GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # dft build publikuje z BuildKitu z atestacją pochodzenia i sprawdza
      # w rejestrze (go-containerregistry), że to indeks z atestacją, a obraz
      # ma konfigurację obrazu przetestowanego wyżej.
      - name: publikacja obrazu api
        id: publish
        if: github.event_name == 'push'
        env:
          PUSH: "1"
        run: ./bin/mise run build

  # Atestacja GitHuba (Sigstore) opublikowanego obrazu: podpis krótkotrwałym
  # certyfikatem wystawionym temu workflowowi, wpis w publicznym dzienniku
  # Rekor, kopia obok obrazu w GHCR. Osobne zadanie, bo id-token: write
  # pozwala każdemu krokowi zadania wybić token OIDC — tu jest tylko akcja
  # atestacji i logowanie do rejestru.
  attest:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Strona atestacji digestu — link w zapisie promocji (zadanie promote).
    outputs:
      url: ${{ steps.attest.outputs.attestation-url }}
    permissions:
      # Token OIDC — tożsamość workflowu dla certyfikatu Sigstore.
      id-token: write
      # Zapis atestacji w API atestacji GitHuba.
      attestations: write
      # Kopia atestacji obok obrazu w GHCR (push-to-registry).
      packages: write
    steps:
      - name: logowanie do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          # Rekordy przechowywania istnieją tylko dla repozytoriów organizacji
          # i wymagałyby uprawnienia artifact-metadata.
          create-storage-record: false

  # Wydanie bez builda (decyzja 40). Tag z adnotacją zakłada u autora
  # `./bin/mise run release` po akceptacji na stagingu i zapisuje w nim
  # digest, który tam stał. dft czyta tag przez API GitHuba — checkout
  # zostawia lokalnie tag bez adnotacji — sprawdza, że wskazuje commit
  # obrazu, a obraz ma pochodzenie z main, i dopisuje w rejestrze tag X.Y.Z
  # do tego samego digestu.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Tag X.Y.Z w GHCR na digeście, który już tam jest.
      packages: write
      # Odczyt atestacji GitHuba obrazu z main (gh attestation verify).
      attestations: read
    outputs:
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.release.outputs.digest }}
      version: ${{ steps.release.outputs.version }}
      predicate-type: ${{ steps.release.outputs.predicate-type }}
      predicate: ${{ steps.release.outputs.predicate }}
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      - name: Go i gh (mise)
        run: ./bin/mise install go gh

      - name: logowanie do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tag wydania w rejestrze
        id: release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./bin/mise run release:image -- "$TAG"

  # Atestacja wydania (Sigstore): digest z main jest wydaniem X.Y.Z, a zapis
  # akceptacji na stagingu jest w predykacie. Podpis wiąże ją z tagiem
  # vX.Y.Z tego workflowu — promocja wymaga właśnie jej (stages/admission),
  # więc obraz z main bez wydania na prod nie wejdzie. Osobne zadanie z tych
  # samych powodów co attest.
  attest-release:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Strona atestacji wydania — link w zapisie promocji (zadanie promote).
    outputs:
      url: ${{ steps.attest.outputs.attestation-url }}
    permissions:
      # Token OIDC — tożsamość workflowu dla certyfikatu Sigstore.
      id-token: write
      # Zapis atestacji w API atestacji GitHuba.
      attestations: write
      # Kopia atestacji obok obrazu w GHCR (push-to-registry).
      packages: write
    steps:
      - name: logowanie do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-name: ${{ needs.release.outputs.image }}
          subject-digest: ${{ needs.release.outputs.digest }}
          predicate-type: ${{ needs.release.outputs.predicate-type }}
          predicate: ${{ needs.release.outputs.predicate }}
          push-to-registry: true
          create-storage-record: false

  # Podatności obrazu (decyzja 37): OSV-Scanner z bazami pobranymi raz na
  # bieg, polityka i wyjątki z datą w dft. Na PR-ze punktem odniesienia jest
  # obraz z main dla commita bazowego — blokuje tylko to, co PR wnosi.
  vulns:
    needs: [build, release]
    # Na tagu build jest pominięty, a obraz wydania przychodzi z zadania
    # release; poza tagiem odwrotnie.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.release.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Tylko Go (dft) i OSV-Scanner — reszta narzędzi niepotrzebna.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      # mise sprawdza sumę z mise.lock i pochodzenie SLSA OSV-Scannera.
      - name: Go i OSV-Scanner (mise)
        run: ./bin/mise install go osv-scanner

      - name: archiwum obrazu z zadania build
        if: github.event_name != 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obraz-api
          path: ${{ runner.temp }}/obraz

      - name: skan obrazu z PR-a względem obrazu z main
        if: github.event_name == 'pull_request'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/obraz/image-api.tar
          CONFIG_DIGEST: ${{ needs.build.outputs.config }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./bin/mise run check:vulns -- --image-archive "$IMAGE_ARCHIVE" --config-digest "$CONFIG_DIGEST" --baseline-commit "$BASE_SHA"

      - name: skan nocny obrazu z main (raport)
        if: github.event_name == 'schedule'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/obraz/image-api.tar
          CONFIG_DIGEST: ${{ needs.build.outputs.config }}
        run: ./bin/mise run check:vulns -- --image-archive "$IMAGE_ARCHIVE" --config-digest "$CONFIG_DIGEST" --report-only

      - name: skan opublikowanego obrazu z main (raport)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: ./bin/mise run check:vulns -- --image "$IMAGE" --report-only

      # Wydanie z naprawialną HIGH/CRITICAL bez wyjątku nie przechodzi —
      # i nie trafi do promocji. Skan biegnie w chwili wydania, a nie
      # builda: podatność opublikowana między buildem na main a tagiem też
      # zatrzymuje promocję.
      - name: skan obrazu wydania
        if: github.ref_type == 'tag'
        env:
          IMAGE: ${{ needs.release.outputs.image }}@${{ needs.release.outputs.digest }}
        run: ./bin/mise run check:vulns -- --image "$IMAGE"

      # Raport z wersją baz — także po porażce. Katalog .cache jest ukryty;
      # w raporcie nie ma sekretów.
      - name: raport podatności
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raport-podatnosci
          path: .cache/reports/vulns-api.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  # Nocą wynik skanu idzie do issue, a nie na czerwono na main: podatność
  # opublikowana w nocy w pakiecie obrazu nie jest porażką ostatniego commita.
  vulns-issue:
    needs: vulns
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Otwarcie, aktualizacja albo zamknięcie issue nocnego skanu.
      issues: write
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      - name: Go i gh (mise)
        run: ./bin/mise install go gh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raport-podatnosci
          path: ${{ runner.temp }}/raport

      - name: issue skanu nocnego
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/raport/vulns-api.json
        run: ./bin/mise run vulns:issue -- "$REPORT"

  # Promocja wydania na prod (decyzje 38 i 40): ten sam digest, który
  # zbudowano na main, przeszedł tam bramki klastrowe, potem akceptację na
  # stagingu i teraz skan podatności, po zgodzie autora w Environment
  # production (recenzent, tylko tagi v* — .github/environments). Zadanie
  # z environment: zapisuje wdrożenie (GitHub Deployment z linkiem do
  # atestacji wydania). Do Etapu 10 nie ma klastra klienta — po weryfikacji
  # zadanie podaje instalację, a nie instaluje.
  promote:
    needs: [release, attest-release, vulns]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ needs.attest-release.outputs.url }}
    permissions:
      contents: read
      # Odczyt atestacji GitHuba obrazu (gh attestation verify).
      attestations: read
      # Odczyt reguł środowiska production: dft odmawia, gdy nie wymaga zgody.
      actions: read
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      - name: Go i gh (mise)
        run: ./bin/mise install go gh

      - name: weryfikacja i zapis promocji
        env:
          IMAGE: ${{ needs.release.outputs.image }}@${{ needs.release.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: ./bin/mise run promote -- "$IMAGE" "$RELEASE_TAG"

  # Środowisko ci (deploy/environments/ci.yaml): efemeryczny klaster k3d na
  # runnerze z obrazem z zadania build — nigdy budowanym od nowa — i te same
  # bramki klastrowe co lokalnie: tożsamość na każdym podzie, drain każdego
  # węzła z repliką, odnowienie certyfikatu pod ruchem. Bez sekretów: TLS na
  # własnym CA, więc działa także na PR-ach od Dependabota i z forków. Na
  # tagu nie biegnie: digest wydania przeszedł ten klaster na main, a potem
  # staging.
  # Okres próbny (decyzja 36): status nie jest jeszcze wymagany przez regułę
  # main; `./bin/mise run ci:trial` mówi, kiedy można go dopisać. Klaster
  # znika razem z maszyną runnera.
  cluster:
    needs: [build, attest]
    # Na PR-ze i nocą attest jest pominięte (nic nie opublikowano) — cluster
    # i tak rusza; po publikacji czeka na atestację, którą sprawdza.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.attest.result != 'failure' }}
    runs-on: ubuntu-24.04
    # Typowy bieg: utworzenie klastra i platforma ~5 minut, bramki ~4.
    timeout-minutes: 30
    permissions:
      # Tylko odczyt kodu: obraz przychodzi z artefaktu tego biegu albo
      # z publicznego rejestru, a zadanie niczego nigdzie nie zapisuje.
      contents: read
      # Odczyt atestacji GitHuba obrazu z GHCR (gh attestation verify).
      attestations: read
    env:
      # mise nakłada mise.ci.toml: DOCFIND_ENV=ci dla dft i KUBECONFIG
      # klastra CI dla kubectl.
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Bez tokenu w .git/config: domyślnie zostaje tam na całe zadanie
          # i może go odczytać każdy późniejszy krok. Skrypty nie pushują.
          persist-credentials: false

      - name: narzędzia (mise)
        env:
          # Tylko w tym kroku, tylko do odczytu: mise sprawdza atestacje
          # GitHuba przez API, a bez tokenu limit to 60 żądań na godzinę.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./bin/mise install

      - name: archiwum obrazu z zadania build
        if: github.event_name != 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obraz-api
          path: ${{ runner.temp }}/obraz

      # Klaster k3d z deploy/k3d/cluster.yaml z nazwą i portami z definicji,
      # platforma, obraz i chart; na końcu tożsamość na każdym podzie.
      # Archiwum musi mieć konfigurację obrazu sprawdzonego w zadaniu build.
      - name: klaster i wdrożenie archiwum z zadania build
        if: github.event_name != 'push'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/obraz/image-api.tar
          CONFIG_DIGEST: ${{ needs.build.outputs.config }}
        run: ./bin/mise run cluster:up -- --image-archive "$IMAGE_ARCHIVE" --config-digest "$CONFIG_DIGEST"

      # Po publikacji: obraz z rejestru po digeście z wyjść zadania build,
      # sprawdzony jak po publikacji (indeks z atestacją, jeden obraz).
      # Środowisko ci wymaga atestacji (artifact.attested): pochodzenie i SBOM
      # w rejestrze i atestacja GitHuba z tego workflowu — gh czyta ją z API.
      - name: klaster i wdrożenie obrazu z GHCR po digeście
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: ./bin/mise run cluster:up -- --image "$IMAGE"

      - name: drain każdego węzła z repliką
        run: ./bin/mise run cluster:drain

      - name: odnowienie certyfikatu pod ruchem
        run: ./bin/mise run cluster:tls

      # Drain przeniósł repliki: nowe pody też mają mieć ten obraz.
      - name: tożsamość na podach po drainach
        run: ./bin/mise run cluster:identity

      # Także po porażce — klaster znika z maszyną runnera, a przyczyna jest
      # w jego stanie: zdarzenia, logi (także sprzed restartu), zasoby
      # platformy, logi kontenerów węzłów.
      - name: dowody z klastra
        if: always()
        timeout-minutes: 5
        run: ./bin/mise run cluster:evidence

      # Raporty bramek, logi sondy z czasami i dowody. Katalog .cache jest
      # ukryty, stąd include-hidden-files; sekretów w nim nie ma — zadanie
      # żadnych nie dostaje, a kubeconfig leży poza tym katalogiem.
      - name: artefakt z dowodami
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dowody-cluster
          path: .cache/reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

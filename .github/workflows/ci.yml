name: ci

# PR      → lint i testy, nic nie opuszcza pipeline'u
# main    → dodatkowo build i publikacja obrazu otagowanego commitem
# tag v*  → build wydania; brudne drzewo odrzucone, obraz otagowany wersją
#
# fetch-depth: 0 jest konieczne — git describe bez pełnej historii i tagów
# zwróci samo sha i wersja artefaktu przestanie rosnąć.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: shellcheck skryptów CI
        run: shellcheck ci/*.sh

      - name: lint i testy
        run: ./ci/run-tests.sh

      # Schemat konfiguracji jest generowany z modelu Pydantic. Gdyby wolno
      # było go zacommitować nieaktualnego, zacząłby kłamać o tym, co
      # aplikacja przyjmie — a to jest plik, który czyta administrator klienta.
      - name: schemat konfiguracji aktualny
        run: ./ci/gen-schema.sh --check

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: logowanie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build obrazu api
        env:
          # Na tagu v* to jest build wydania: brudne drzewo przerywa pipeline.
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: ./ci/build.sh api

      # Warunki zakończenia Etapu 1 sprawdzane na artefakcie, nie na kodzie:
      # rozmiar obrazu, odmowa startu bez konfiguracji, czas zamykania.
      - name: warunki zakończenia etapu
        run: ./ci/check-runtime.sh api

      - name: publikacja obrazu api
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          PUSH: "1"
        run: ./ci/build.sh api

name: ci

# PR      → lint i testy, nic nie opuszcza pipeline'u
# main    → dodatkowo build i publikacja obrazu otagowanego commitem
# tag v*  → build wydania; brudne drzewo odrzucone, obraz otagowany wersją
#
# fetch-depth: 0 jest konieczne — git describe bez pełnej historii i tagów
# zwróci samo sha i wersja artefaktu przestanie rosnąć.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Akcje przypięte pełnym SHA commita, nie tagiem. Tag akcji jest przesuwalny —
# tak w 2025 roku skompromitowano tj-actions/changed-files: napastnik przesunął
# tagi na złośliwy commit i każdy pipeline z @v… wykonał go ze swoimi sekretami.
# Komentarz z wersją czyta Dependabot, aktualizując przypięcia (.github/dependabot.yml).

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # Jeden skrypt: shellcheck, lint, testy, aktualność schematu. Osobny krok
      # w CI, którego nie ma w run-tests.sh, to krok, który lokalnie nie biegnie.
      - name: shellcheck, lint, testy, schemat
        run: ./ci/run-tests.sh

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: logowanie do GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build obrazu api
        env:
          # Na tagu v* to jest build wydania: brudne drzewo przerywa pipeline.
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: ./ci/build.sh api

      # Warunki zakończenia Etapu 1 sprawdzane na artefakcie, nie na kodzie:
      # rozmiar obrazu, odmowa startu bez konfiguracji, czas zamykania.
      - name: warunki zakończenia etapu
        run: ./ci/check-runtime.sh api

      # Dwa buildy od zera muszą dać identyczny obraz. Publikowany digest da
      # się wtedy niezależnie odtworzyć z commita, a zmiana digestu zawsze
      # oznacza zmianę zawartości.
      - name: powtarzalność builda
        run: ./ci/check-reproducible.sh api

      - name: publikacja obrazu api
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          PUSH: "1"
        run: ./ci/build.sh api

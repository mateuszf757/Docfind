name: dependabot-auto-merge

# Łatki od Dependabota są scalane automatycznie, ale dopiero wtedy, gdy
# przejdzie wymagane CI. `gh pr merge --auto` nie scala od razu — włącza
# auto-merge, a GitHub scala PR po przejściu wymaganych sprawdzeń z reguły
# gałęzi main. Bez tej reguły --auto scaliłby natychmiast, bez żadnej bramki,
# dlatego jest ona warunkiem działania tego workflowu (docs/DECYZJE.md, decyzja 22).
#
# Scalanie tokenem aplikacji GitHuba, nie GITHUB_TOKEN. Zdarzenia wywołane
# przez GITHUB_TOKEN nie uruchamiają workflowów: PR scalony w jego imieniu
# wchodził do main bez biegu ci.yml na push, więc bez publikacji obrazu.
# Bez skonfigurowanej aplikacji workflow niczego nie scala i zostawia
# ostrzeżenie — PR czeka na człowieka, zamiast wejść bez obrazu.
#
# Zwykły pull_request, nie pull_request_target. Ten drugi uruchamia się
# z uprawnieniami repozytorium w kontekście PR-a i jest klasycznym wektorem
# ataku na pipeline'y. Tutaj nie jest potrzebny: PR od Dependabota widzi
# sekrety Dependabota (Settings → Secrets and variables → Dependabot).

on:
  pull_request:

# Domyślnie nic — odczyt tylko w zadaniu, które go potrzebuje.
permissions: {}

# Jeden bieg na PR: nowy push od Dependabota (rebase) unieważnia poprzedni.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    # Autor PR-a, a nie github.actor: actor to ten, kto wywołał zdarzenie,
    # i przy ponownym uruchomieniu przez człowieka warunek przestałby działać.
    # Sprawdzenie repozytorium wyklucza forki.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.repository == 'mateuszf757/Docfind'
    # GITHUB_TOKEN tylko do odczytu metadanych PR-a; scala token aplikacji.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # v3.1.0 poprawia update-type: null dla PR-ów Pythona (uv) — w v2.5.0
      # łatki z uv.lock nie dostawały typu i nigdy nie scalały się same.
      - name: metadane aktualizacji
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # update-type to najwyższa zmiana w PR-ze, także grupowym — dlatego
      # grupy w dependabot.yml są rozdzielone na patch i minor.
      #
      # Odświeżenie digestu bez zmiany tagu (python:3.12-alpine@sha256:A → B)
      # fetch-metadata klasyfikuje błędnie jako semver-major, z poprzednią
      # wersją w postaci skróconego digestu w backtickach
      # (dependabot/fetch-metadata#726). To zwykle łatka Pythona albo Alpine,
      # więc jest traktowane jak łatka; nowe wydanie Alpine pod tym samym tagiem
      # zatrzymuje ci/check-image-base.sh w zadaniu build.
      #
      # Metadane idą przez zmienne środowiskowe, nie są wstawiane do skryptu —
      # nazwa zależności pochodzi z PR-a, a więc z zewnątrz.
      - name: klasyfikacja aktualizacji
        id: kind
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PREVIOUS: ${{ steps.metadata.outputs.previous-version }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          # Skrócony digest przychodzi w backtickach (\140); porównujemy bez nich.
          previous=$(printf '%s' "$PREVIOUS" | tr -d '\140')
          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
            kind="patch"
          elif [[ "$ECOSYSTEM" == "docker" && "$previous" =~ ^[0-9a-f]{7,64}$ ]]; then
            kind="digest"
          else
            kind="review"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "$DEPENDENCIES: update-type='$UPDATE_TYPE', poprzednio '$previous' → $kind"

      - name: czy jest aplikacja do scalania
        id: app
        if: steps.kind.outputs.kind != 'review'
        env:
          CLIENT_ID: ${{ secrets.DOCFIND_AUTOMERGE_CLIENT_ID }}
        run: |
          if [[ -n "$CLIENT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak sekretu Dependabota DOCFIND_AUTOMERGE_CLIENT_ID — bez aplikacji scalenie nie uruchomiłoby CI na main (decyzja 22). PR czeka na ręczne scalenie."
          fi

      # Token ograniczony do tego repozytorium i do dwóch uprawnień, których
      # wymaga włączenie auto-merge; wygasa po godzinie i jest unieważniany
      # na końcu zadania.
      - name: token aplikacji
        id: app-token
        if: steps.app.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DOCFIND_AUTOMERGE_CLIENT_ID }}
          private-key: ${{ secrets.DOCFIND_AUTOMERGE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: włączenie auto-merge
        if: steps.app.outputs.configured == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KIND: ${{ steps.kind.outputs.kind }}
        run: |
          echo "Aktualizacja typu $KIND — auto-merge po przejściu wymaganych sprawdzeń."
          gh pr merge --auto --squash "$PR_URL"

      - name: pozostałe aktualizacje czekają na przegląd
        if: steps.kind.outputs.kind == 'review'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        run: echo "::notice::$UPDATE_TYPE ($DEPENDENCIES) — bez auto-merge, wymaga przeglądu."

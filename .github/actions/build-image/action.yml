name: build obrazu api
description: >-
  Build obrazu api z HEAD i jego sprawdzenia — baza, testy na musl, warunki
  Etapu 1, powtarzalność — a potem archiwum dla zadania
  cluster albo publikacja do GHCR. Wspólne kroki zadań build (PR, noc, token
  tylko do odczytu) i build-publish (push na main, packages: write): te same
  kroki, różne uprawnienia tokenu, bo uprawnienia dostaje zadanie, a nie krok
  (decyzja 49). Wymaga przed użyciem checkoutu z pełną historią i kroków
  „Go (mise)” i „dft” w zadaniu — dft budowany ze źródeł w zadaniu, które go
  uruchamia, a podatek startowy widać w budżetach (decyzja 69).

inputs:
  publish:
    description: >-
      "true" — publikacja do GHCR (tylko zadanie z packages: write);
      "false" — archiwum docker save dla zadania cluster.
    required: true

outputs:
  image:
    description: Repozytorium opublikowanego obrazu; puste bez publikacji.
    value: ${{ steps.publish.outputs.image }}
  digest:
    description: Digest indeksu opublikowanego obrazu; pusty bez publikacji.
    value: ${{ steps.publish.outputs.digest }}
  config:
    description: Digest konfiguracji obrazu z archiwum; pusty przy publikacji.
    value: ${{ steps.build.outputs.config }}

runs:
  using: composite
  steps:
    # Obraz BuildKit z ci/pins.env. Bez przypięcia sterownik docker-container
    # bierze przesuwalny tag, a od wersji BuildKit (i wbudowanego w nią
    # frontendu Dockerfile) zależy, czy obraz z CI jest bajt w bajt taki jak
    # lokalny (decyzja 21).
    - name: przypięte wersje
      id: pins
      shell: bash
      run: ./bin/mise run pins

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=${{ steps.pins.outputs.buildkit }}

    - name: build obrazu api
      id: build
      shell: bash
      env:
        # Bez publikacji obraz idzie do zadania cluster jako archiwum
        # `docker save` — w rejestrze go nie ma. dft zapisuje do wyjść kroku
        # digest jego konfiguracji.
        ARCHIVE: ${{ inputs.publish != 'true' && format('{0}/image-api.tar', runner.temp) || '' }}
      run: ./bin/mise run build

    # Odświeżenie digestu python:3.14-alpine od Dependabota jest scalane
    # automatycznie, ale może przynieść nowe wydanie Alpine. Tu zamienia się to
    # w czerwony build, dopóki człowiek nie podbije DF_BASE_ALPINE.
    - name: baza obrazu zgodna z zapisaną
      shell: bash
      run: ./bin/mise run check:base

    # Testy jednostkowe na tej samej bazie co produkcja: musl i ta sama łatka
    # Pythona. Zadanie test uruchamia je na glibc runnera.
    - name: testy na obrazie (musl)
      shell: bash
      run: ./bin/mise run test:image

    # Warunki zakończenia Etapu 1 sprawdzane na artefakcie, nie na kodzie:
    # rozmiar obrazu, dym z ustawieniami poda z charta (system plików tylko
    # do odczytu, użytkownik z charta, /version z commitem — decyzja 72),
    # odmowa startu bez konfiguracji i ze złą konfiguracją, koszt zamykania,
    # żądanie w locie przy SIGTERM. Raport JSON zostaje w .cache/reports.
    - name: warunki zakończenia etapu
      shell: bash
      run: ./bin/mise run check:runtime

    # Build z pamięcią podręczną i build od zera muszą dać identyczny obraz.
    # Publikowany digest da się wtedy niezależnie odtworzyć z commita, a zmiana
    # digestu zawsze oznacza zmianę zawartości.
    - name: powtarzalność builda
      shell: bash
      run: ./bin/mise run check:reproducible

    # Archiwum dopiero po wszystkich sprawdzeniach: zadanie cluster dostaje
    # obraz, który je przeszedł, i porówna jego konfigurację z digestem z wyjść
    # zadania. Jeden dzień — to tylko przekazanie w obrębie biegu.
    - name: archiwum obrazu dla zadania cluster
      if: inputs.publish != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: obraz-api
        path: ${{ runner.temp }}/image-api.tar
        retention-days: 1
        if-no-files-found: error

    # Logowanie i publikacja po wszystkich sprawdzeniach: dane logowania leżą
    # w ~/.docker/config.json od tego kroku do końca zadania, więc nie ma ich
    # tam, gdy biegną build, testy i bramki. Token z prawem zapisu ma tylko
    # zadanie build-publish, które nie biegnie na PR-ach (decyzja 49).
    - name: logowanie do GHCR
      if: inputs.publish == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # dft build publikuje z BuildKitu z atestacją pochodzenia i sprawdza
    # w rejestrze (go-containerregistry), że to indeks z atestacją, a obraz ma
    # konfigurację obrazu przetestowanego wyżej.
    - name: publikacja obrazu api
      id: publish
      if: inputs.publish == 'true'
      shell: bash
      env:
        PUSH: "1"
      run: ./bin/mise run build

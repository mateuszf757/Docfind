# Świadomie przyjęte podatności obrazu (decyzja 37) — czyta `dft check vulns`.
#
# Każdy wyjątek dotyczy jednej podatności w jednym pakiecie, ma uzasadnienie
# i datę wygaśnięcia nie dalszą niż 90 dni: od tego dnia podatność znów
# blokuje. Wyjątek, któremu nic nie odpowiada, bramka zgłasza do usunięcia.
#
#   id       CVE, GHSA, GO-… albo identyfikator OSV (pasuje też alias)
#   package  nazwa pakietu z raportu (apk, PyPI)
#   expires  RRRR-MM-DD
#   reason   dlaczego teraz nie naprawiamy i co ją naprawi
exceptions: []

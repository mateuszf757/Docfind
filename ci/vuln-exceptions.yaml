# Świadomie przyjęte podatności obrazu (decyzja 37) — czyta `dft check vulns`.
#
# Każdy wyjątek dotyczy jednej podatności w jednym pakiecie, ma uzasadnienie
# i datę wygaśnięcia nie dalszą niż 90 dni: od tego dnia podatność znów
# blokuje. Wyjątek, któremu nic nie odpowiada, bramka zgłasza do usunięcia.
#
#   id       CVE, GHSA, GO-… albo identyfikator OSV (pasuje też alias)
#   package  nazwa pakietu z raportu (apk, PyPI)
#   expires  RRRR-MM-DD
#   reason   dlaczego teraz nie naprawiamy i co ją naprawi
exceptions:
  - id: CVE-2026-85091
    package: zlib
    expires: 2026-10-28
    reason: >-
      Wersja z poprawką (1.3.2-r1) jest w Alpine 3.24 od 2026-10-06, ale nie
      ma jej jeszcze w żadnym obrazie python:3.14-alpine (najnowszy,
      z 2026-10-01, ma 1.3.2-r0). Przyjdzie z odświeżeniem digestu bazy przez
      Dependabota. `apk upgrade` w Dockerfile złamałby powtarzalność builda
      (decyzja 21), a przypięcie zlib=1.3.2-r1 — build, gdy Alpine usunie tę
      wersję z repozytorium.

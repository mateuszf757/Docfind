# Skrypty w ci/ uruchamia także systemowy python3 — compare_oci.py
# w check-reproducible.sh (zadanie build nie ma uv) i wstawki w skryptach
# bashowych. Na Ubuntu 24.04, lokalnie i na runnerze, to Python 3.12.
# Reguły są te same co dla usługi, ale składnia celuje w 3.12: przy celu 3.14
# formatter zdejmowałby nawiasy w `except (A, B):` (PEP 758), a to na 3.12
# błąd składni — build padłby jako „awaria narzędzia" w porównaniu obrazów.
extend = "../services/api/pyproject.toml"
target-version = "py312"

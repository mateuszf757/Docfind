[project]
name = "docfind-api"
version = "0.0.0"
description = "DOCFIND — API wyszukiwania dokumentów"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    # Importowany wprost w docfind_api.models, więc jest zależnością bezpośrednią,
    # nie przechodnią przez fastapi.
    "pydantic>=2.9",
    # Konfiguracja jest w YAML-u, bo czyta ją administrator klienta.
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
    # Zamiast uvicorn[standard]: bierzemy uvloop i httptools dla wydajności,
    # ale nie websockets (nie używamy ich — strumieniowanie na Etapie 7 idzie
    # przez chunked HTTP) ani watchfiles (przeładowanie kodu to narzędzie
    # deweloperskie, w obrazie jest tylko martwym megabajtem).
    "uvicorn>=0.32",
    "uvloop>=0.21",
    "httptools>=0.6",
]

# Zależności deweloperskie jako grupy (PEP 735), nie extra. Extra jest częścią
# metadanych pakietu i instaluje się tylko na żądanie (--extra), więc
# `uv sync --no-dev` w Dockerfile nic przy nim nie robiło — ruff i pytest nie
# trafiały do obrazu tylko dlatego, że nikt nie podał --extra dev. Grupa `dev`
# jest domyślna dla `uv sync` i to ją wyłącza --no-dev.
#
# `test` jest osobno, bo testy biegną także w obrazie na musl (target test
# w Dockerfile), a tam lint i type checker nie są potrzebne.
[dependency-groups]
test = [
    "pytest>=8.3",
    # httpx2 zamiast httpx: Starlette 1.6 w TestCliencie szuka najpierw httpx2,
    # a przy httpx zgłasza StarletteDeprecationWarning. httpx nie ma wydania od
    # grudnia 2024; httpx2 to jego kontynuacja w organizacji Pydantic.
    "httpx2>=2.12",
]
dev = [
    { include-group = "test" },
    "ruff>=0.8",
    "mypy>=2.3",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
# Projekt nie jest budowany jako pakiet — w obrazie kod jest kopiowany jako pliki
# (docs/DECYZJE.md, decyzja 21), a testy importują go przez pythonpath. Bez tego
# `uv sync` instalował projekt w trybie edytowalnym i przy każdej świeżej
# synchronizacji pobierał i uruchamiał najnowszego hatchlinga: zależność
# budowania, której nie ma w uv.lock, więc nieprzypiętą (decyzja 20).
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# ASYNC: blokujące wywołania w `async def` (sleep, open, requests) zatrzymują
# pętlę zdarzeń całego procesu — w tym sondy kubeleta. Ważne od chwili, gdy
# handlery diagnostyczne są asynchroniczne, a klient ES/LLM dojdzie na Etapach 6-7.
# S: bandit — shell=True, yaml.load bez SafeLoadera, twarde hasła.
# PT: konwencje pytesta, m.in. pytest.raises bez match=.
# RUF: m.in. zmienne domyślne jako argumenty i niejawne Optional.
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "PT", "RUF"]
ignore = [
    # Porównania w testach to assert — w src nie ma ani jednego.
    "S101",
    # Wiązanie z 0.0.0.0 jest poprawne w kontenerze: pod ma własną przestrzeń
    # nazw sieci, a Service kieruje ruch na adres poda, nie na loopback.
    "S104",
]

[tool.ruff.lint.per-file-ignores]
# Dane testowe celowo zawierają nazwy i wartości udające sekrety.
"tests/**" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["docfind_api", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "."]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." daje testom import pakietu tests (dane i typy wyposażenia);
# "src" daje im kod aplikacji bez instalowania go w trybie edytowalnym.
pythonpath = ["src", "."]
# Ostrzeżenie o przestarzałym API ma zatrzymać CI, a nie przewinąć się w logu:
# następne wydanie zależności zamieni je w błąd, a wtedy łatka od Dependabota
# padnie bez wskazówki dlaczego. Wyjątki tylko dla cudzego kodu, którego nie
# poprawimy, każdy z powodem.
filterwarnings = [
    "error",
    # starlette/testclient.py sam używa aliasu anyio.abc.BlockingPortal.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

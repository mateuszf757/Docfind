[project]
name = "docfind-api"
version = "0.0.0"
description = "DOCFIND — API wyszukiwania dokumentów"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Importowany wprost w docfind_api.models, więc jest zależnością bezpośrednią,
    # nie przechodnią przez fastapi.
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docfind_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["docfind_api", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." daje testom import pakietu tests (dane i typy wyposażenia);
# "src" daje im kod aplikacji bez instalowania go w trybie edytowalnym.
pythonpath = ["src", "."]
